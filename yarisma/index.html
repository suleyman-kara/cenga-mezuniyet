<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f24">
<title>Salon Yarışması</title>
<link rel="stylesheet" href="ortak/salon.css">
<style>
/* Salon Yarışması · projektör ekranı. 1920×1080 sahne pencereye ölçeklenir (Salon.sahneOlcekle).
   Okunurluk: en küçük yazı 28 px (sahne pikseli), soru 76 px, seçenekler 52 px. */
:root{--zemin:#0a0f24;--zemin2:#141b3d;--yazi:#f5f7ff;--soluk:#a9b3d9;--vurgu:#00e5ff;--sari:#ffd23f;--yesil:#21d07a;--kirmizi:#ff5a6e;
 --a:#6c3ef0;--b:#00b4ee;--c:#ffb300;--d:#e8336f;--ay:#fff;--by:#03202b;--cy:#2b1c00;--dy:#fff;
 --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05081a;overflow:hidden;color:var(--yazi);font-family:var(--font)}
#sahne{overflow:hidden;background:radial-gradient(1200px 700px at 85% -10%,#2b1f6e 0%,transparent 60%),radial-gradient(900px 600px at -5% 110%,#073a5a 0%,transparent 60%),var(--zemin);
 user-select:none;cursor:default}
#sahne::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.ekran{position:absolute;inset:110px 70px 70px;display:none}
.ekran.on{display:block}

/* üst şerit */
#ust{position:absolute;left:70px;right:70px;top:28px;height:64px;display:flex;align-items:center;gap:28px;font-weight:800;font-size:30px}
.logo{display:flex;align-items:center;gap:14px;letter-spacing:.06em;font-size:30px;font-weight:900}
.logo i{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--sari);color:#1a1300;font-style:normal;font-size:34px;transform:rotate(-6deg)}
.logo b{color:var(--vurgu)}
#ustBilgi{flex:1;text-align:center;color:var(--soluk);font-size:30px;letter-spacing:.04em}
.rozet{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:99px;background:rgba(255,255,255,.08);font-size:30px;font-weight:800}
#otoRozet{display:none;background:var(--vurgu);color:#032029}#otoRozet.on{display:inline-flex}
#katRozet b{color:var(--sari);font-variant-numeric:tabular-nums}

/* lobi */
#lobi .sol{position:absolute;left:0;top:10px;width:1080px}
#lobi h1{font-size:122px;line-height:.95;margin:0 0 14px;font-weight:900;letter-spacing:-.02em}
#lobi h1 span{display:block;color:var(--sari)}
#lobi .alt{font-size:40px;color:var(--soluk);font-weight:700;margin:0 0 40px}
.adimlar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.adimlar li{display:flex;align-items:center;gap:26px;font-size:44px;font-weight:800;white-space:nowrap}
.adimlar li b{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.1);color:var(--vurgu);font-size:40px}
#lobi .qrKart{position:absolute;right:0;top:0;width:560px;background:#fff;border-radius:36px;padding:26px 26px 20px;color:#0a0f24;text-align:center;box-shadow:0 22px 0 rgba(0,0,0,.25),0 0 0 10px rgba(0,229,255,.25)}
#qrBuyuk{width:508px;height:470px;display:grid;place-items:center}
#qrBuyuk svg{width:470px;height:470px;display:block}
#qrUrl{font-size:30px;font-weight:900;margin-top:8px;line-height:1.2}
#qrUrl span{display:block;font-size:40px;color:#3b1fb0;letter-spacing:.02em}
#qrNot{font-size:28px;font-weight:700;color:#5a6488;margin-top:4px}
#qrBuyuk.yok{font-size:40px;font-weight:800;color:#5a6488;padding:30px;line-height:1.3}
#qrBuyuk.yok small{font-size:30px}
#lobi .alt-bant{position:absolute;left:0;right:0;bottom:0;height:215px;display:flex;align-items:center;gap:44px;border-top:3px solid rgba(255,255,255,.1);padding-top:14px}
#lobiSay{flex:none;text-align:center;min-width:280px}
#lobiSay b{display:block;font-size:136px;line-height:1;font-weight:900;color:var(--sari);font-variant-numeric:tabular-nums}
#lobiSay span{font-size:34px;font-weight:800;color:var(--soluk)}
#adlar{flex:1;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;height:200px;overflow:hidden}
#adlar span{font-size:32px;font-weight:800;padding:8px 22px;border-radius:99px;background:rgba(255,255,255,.1);animation:adGir .5s cubic-bezier(.2,1.6,.4,1) both}
#adlar span:nth-child(4n+1){background:rgba(108,62,240,.45)}#adlar span:nth-child(4n+2){background:rgba(0,180,238,.35)}#adlar span:nth-child(4n+3){background:rgba(255,179,0,.3)}#adlar span:nth-child(4n){background:rgba(232,51,111,.35)}
@keyframes adGir{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#lobiIpucu{position:absolute;right:0;top:760px;width:640px;text-align:center;font-size:30px;font-weight:800;color:var(--soluk)}
#devamKart{display:none;position:absolute;left:0;top:300px;width:1080px;padding:26px 34px;border-radius:26px;background:#2b2410;border:5px solid var(--sari);font-size:40px;font-weight:900;box-shadow:0 14px 0 rgba(0,0,0,.35)}
#devamKart.on{display:block}#devamKart small{display:block;font-size:34px;color:#ffe9a8;margin-top:8px;font-weight:800}

/* soru */
#soruUst{position:absolute;left:0;right:260px;top:0;display:flex;align-items:center;gap:20px}
#soruNo{font-size:40px;font-weight:900;letter-spacing:.06em;color:var(--vurgu)}
#soruEtiket{font-size:30px;font-weight:900;padding:6px 20px;border-radius:12px;background:var(--sari);color:#1a1300;letter-spacing:.05em;text-transform:uppercase}
#soruEtiket:empty{display:none}
#soruEtiket.anket{background:#b48cff;color:#1a0a3a}
#soruMetin{position:absolute;left:0;right:260px;top:70px;height:250px;display:flex;align-items:center;font-size:76px;line-height:1.12;font-weight:900;letter-spacing:-.01em}
#soruMetin.uzun{font-size:64px}
#sayac{position:absolute;right:0;top:0;width:220px;height:220px}
#sayac svg{transform:rotate(-90deg)}
#sayacN{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;font-variant-numeric:tabular-nums}
#sayac.sicak #sayacN{color:var(--kirmizi);animation:nabiz .5s ease-in-out infinite alternate}
#sayacHalka{transition:stroke-dashoffset .25s linear,stroke .3s}
#sayac.sicak #sayacHalka{stroke:var(--kirmizi)}
#sayac.bitti #sayacN{font-size:72px;color:var(--yesil);animation:none}
@keyframes nabiz{to{transform:scale(1.12)}}
#secenekler{position:absolute;left:0;right:0;top:350px;bottom:110px;display:grid;gap:30px;grid-template-columns:1fr 1fr}
#secenekler.n3{grid-template-columns:1fr 1fr 1fr}
#secenekler.n2{grid-template-columns:1fr 1fr}
.sec{position:relative;border-radius:30px;padding:28px 34px 26px 150px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
 box-shadow:0 12px 0 rgba(0,0,0,.28);transition:transform .35s,opacity .4s,filter .4s,box-shadow .35s;animation:secGir .45s cubic-bezier(.2,1.4,.4,1) both}
.sec:nth-child(2){animation-delay:.08s}.sec:nth-child(3){animation-delay:.16s}.sec:nth-child(4){animation-delay:.24s}
@keyframes secGir{from{transform:translateY(40px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.sec.a{background:var(--a);color:var(--ay)}.sec.b{background:var(--b);color:var(--by)}.sec.c{background:var(--c);color:var(--cy)}.sec.d{background:var(--d);color:var(--dy)}
.sec .k{position:absolute;left:30px;top:50%;margin-top:-50px;width:100px;height:100px;border-radius:26px;display:grid;place-items:center;font-size:62px;font-weight:900;background:rgba(0,0,0,.22);color:#fff}
.sec .t{font-size:52px;line-height:1.1;font-weight:900;position:relative;z-index:1;padding-right:150px}
#secenekler.n3 .sec{padding:28px 30px 90px;justify-content:flex-start}
#secenekler.n3 .sec .k{position:relative;left:auto;top:auto;margin:0 0 24px}
#secenekler.n3 .sec .t{padding-right:0}
.sec .cubuk{position:absolute;left:0;bottom:0;height:18px;width:0;background:rgba(0,0,0,.3);transition:width .4s ease-out}
.sec .say{position:absolute;right:30px;top:50%;margin-top:-34px;font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;opacity:.95;z-index:1}
#secenekler.n3 .sec .say{top:auto;bottom:34px;margin:0}
#secenekler.gizliSay .say,#secenekler.gizliSay .cubuk{visibility:hidden}
.sec.secim::after{content:"SENİN SEÇİMİN";position:absolute;right:26px;top:16px;font-size:26px;font-weight:900;padding:4px 14px;border-radius:10px;background:#fff;color:#0a0f24;z-index:2}
#secenekler.demo .sec{cursor:pointer}
/* cevap açıklandı */
#soruEkran.cevap .sec.yanlis{opacity:.28;filter:saturate(.25);transform:scale(.97)}
#soruEkran.cevap .sec.dogru{transform:scale(1.03);box-shadow:0 0 0 10px #fff,0 0 80px 10px rgba(33,208,122,.65),0 14px 0 rgba(0,0,0,.3);z-index:2}
#soruEkran.cevap .sec.dogru .k{background:var(--yesil);color:#04210f}
#soruEkran.cevap .sec.dogru .k::before{content:"✓";position:absolute;inset:0;display:grid;place-items:center;background:var(--yesil);border-radius:inherit}
#soruEkran.cevap #secenekler .say,#soruEkran.cevap #secenekler .cubuk{visibility:visible}
#soruAlt{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;gap:30px;font-size:38px;font-weight:800}
#cevapSay b{color:var(--sari);font-variant-numeric:tabular-nums}
#soruNot{flex:1;text-align:right;color:var(--soluk);font-size:32px;margin-right:130px}
#cevapBilgi{display:none;flex:1;font-size:40px;font-weight:900}
#cevapBilgi em{font-style:normal;color:var(--yesil)}
#soruEkran.cevap #cevapBilgi{display:block}
#soruEkran.cevap #soruNot{display:none}
#aciklama{display:none;position:absolute;left:0;right:260px;top:300px;font-size:34px;font-weight:700;color:var(--sari)}
#soruEkran.cevap #aciklama:not(:empty){display:block}
#qrKucuk{position:absolute;right:0;bottom:-6px;width:96px;height:96px;background:#fff;border-radius:12px;padding:6px;display:none}
#qrKucuk svg{width:100%;height:100%;display:block}
#qrKucuk.on{display:block}
#soruEkran.giris #secenekler{visibility:hidden}

/* sıralama */
#tabloEkran h2,#finalEkran h2{margin:0;font-size:92px;font-weight:900;letter-spacing:-.01em}
#tabloEkran h2 small{font-size:40px;color:var(--soluk);font-weight:800;margin-left:24px;letter-spacing:0}
#tablo{margin-top:36px;display:flex;flex-direction:column;gap:16px}
.satir{display:grid;grid-template-columns:110px 1fr 200px 260px;align-items:center;height:84px;padding:0 34px;border-radius:24px;background:rgba(255,255,255,.07);font-size:46px;font-weight:900;animation:satirGir .5s cubic-bezier(.2,1.2,.4,1) both}
.satir:nth-child(1){background:linear-gradient(90deg,rgba(255,210,63,.4),rgba(255,210,63,.1))}
.satir .s{color:var(--vurgu)}.satir .ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.satir .art{font-size:38px;color:var(--yesil);text-align:right}.satir .art.sifir{color:var(--soluk)}
.satir .p{text-align:right;font-variant-numeric:tabular-nums}
.satir .ok{font-size:30px;margin-left:16px;color:var(--yesil)}.satir .ok.as{color:var(--kirmizi)}
@keyframes satirGir{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
#tabloBos{font-size:48px;font-weight:800;color:var(--soluk);margin-top:60px}

/* final */
#finalEkran h2{text-align:center}
#finalEkran .altb{text-align:center;font-size:40px;font-weight:800;color:var(--soluk);margin-top:6px}
#podyum{position:absolute;left:40px;right:40px;bottom:0;height:640px;display:flex;align-items:flex-end;justify-content:center;gap:30px;z-index:1}
.basamak{width:540px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;animation:basamakGir .8s cubic-bezier(.2,1.2,.4,1) both}
.basamak .kim{font-size:54px;font-weight:900;text-align:center;line-height:1.05;margin-bottom:6px;max-width:540px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.basamak .pp{font-size:40px;font-weight:800;color:var(--soluk);margin-bottom:16px;font-variant-numeric:tabular-nums}
.basamak .blok{width:100%;border-radius:28px 28px 0 0;display:grid;place-items:center;font-size:150px;font-weight:900;color:rgba(0,0,0,.35)}
.basamak.b1 .blok{height:400px;background:linear-gradient(#ffe27a,#ffb300)}.basamak.b1 .kim{font-size:66px;color:var(--sari)}
.basamak.b2 .blok{height:290px;background:linear-gradient(#eef2ff,#9aa6c8)}
.basamak.b3 .blok{height:210px;background:linear-gradient(#ffc39a,#c8692d)}
.basamak.b1{animation-delay:1.2s}.basamak.b2{animation-delay:.6s}.basamak.b3{animation-delay:0s}
@keyframes basamakGir{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
#digerleri{position:absolute;left:0;right:0;top:232px;display:flex;justify-content:center;gap:22px;font-size:32px;font-weight:800;color:var(--soluk);z-index:1}
#digerleri span{padding:8px 22px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
#digerleri b{color:var(--yazi);margin:0 8px}
#finalEkran h2,#finalEkran .altb{position:relative;z-index:1}
.konfeti{position:absolute;top:-40px;width:16px;height:24px;border-radius:4px;animation:dus linear forwards;pointer-events:none;z-index:0;opacity:.85}
@keyframes dus{to{transform:translateY(1200px) rotate(900deg)}}

/* katmanlar */
#durakOv{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,8,26,.72);z-index:30;font-size:120px;font-weight:900;letter-spacing:.05em}
#durakOv.on{display:grid}#durakOv small{display:block;font-size:40px;color:var(--soluk);text-align:center;letter-spacing:0;margin-top:10px}
#hataOv{position:absolute;inset:0;display:none;z-index:40;background:#2a0b14;padding:100px;font-size:40px;font-weight:700}
#hataOv.on{display:block}#hataOv h2{font-size:72px;margin:0 0 30px}#hataOv li{margin-bottom:12px}
#tuslar{position:absolute;left:70px;bottom:22px;font-size:28px;font-weight:700;color:rgba(169,179,217,.65);display:none}
#lobi.on~#tuslar{display:block}
</style>
</head>
<body>
<div id="sahne">
  <header id="ust">
    <span class="logo"><i>?</i><span>SALON <b>YARIŞMASI</b></span></span>
    <span id="ustBilgi"></span>
    <span class="rozet" id="otoRozet">⏩ OTO</span>
    <span class="rozet" id="katRozet">👥 <b id="katSay">0</b></span>
  </header>

  <section class="ekran on" id="lobi">
    <div class="sol">
      <h1 id="lobiBaslik">Salon<span>Yarışması</span></h1>
      <p class="alt" id="lobiAlt"></p>
      <ol class="adimlar" id="adimlar">
        <li><b>1</b>Telefon kamerasıyla QR'ı okut</li>
        <li><b>2</b>İstersen takma adını yaz</li>
        <li><b>3</b>Soruyu telefondan cevapla: hızlı olan kazanır</li>
      </ol>
      <div id="devamKart"></div>
    </div>
    <div class="qrKart"><div id="qrBuyuk" class="yok">Bağlanıyor…</div><div id="qrUrl"></div><div id="qrNot"></div></div>
    <div class="alt-bant"><div id="lobiSay"><b id="lobiSayN">0</b><span>kişi katıldı</span></div><div id="adlar"></div></div>
  </section>

  <section class="ekran" id="soruEkran">
    <div id="soruUst"><span id="soruNo"></span><span id="soruEtiket"></span></div>
    <div id="soruMetin"></div>
    <div id="aciklama"></div>
    <div id="sayac"><svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="94" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="18"/><circle id="sayacHalka" cx="110" cy="110" r="94" fill="none" stroke="#00e5ff" stroke-width="18" stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="0"/></svg><div id="sayacN"></div></div>
    <div id="secenekler"></div>
    <div id="soruAlt"><span id="cevapSay"></span><span id="soruNot"></span><span id="cevapBilgi"></span><div id="qrKucuk"></div></div>
  </section>

  <section class="ekran" id="tabloEkran"><h2>Sıralama <small id="tabloAlt"></small></h2><div id="tablo"></div><div id="tabloBos"></div></section>

  <section class="ekran" id="finalEkran"><h2 id="finalBaslik">Kazananlar</h2><div class="altb" id="finalAlt"></div><div id="digerleri"></div><div id="podyum"></div></section>

  <div id="tuslar">Boşluk: başla · F: tam ekran · U: kumanda · M: ses</div>
  <div id="durakOv"><div>⏸ DURAKLATILDI<small>P: devam</small></div></div>
  <div id="hataOv"></div>
</div>

<script src="oylama/vote-core.js"></script>
<script src="oylama/qr.js"></script>
<script src="oylama/qr-svg.js"></script>
<script src="oylama/firebase-config.js"></script>
<script src="ortak/puan.js"></script>
<script src="ortak/salon.js"></script>
<script src="sorular.js"></script>
<script>
(function () {
'use strict';
/* ---------- Salon Yarışması: oyun mantığı (soru akışı, puan, ekranlar). Altyapı (oylama, oturum, QR, kumanda, önbellek) ortak/salon.js'te. ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Q = new URLSearchParams(location.search);
const Y = window.YARISMA || null;
const A = Object.assign({ sure: 20, tablo: true, canliCubuk: true, taban: 500, tavan: 1000, otoBekleme: 7 }, (Y && Y.ayarlar) || {});
const SORULAR = (Y && Y.sorular) || [];
const N = SORULAR.length, HARF = 'abcd';
Salon.sahneOlcekle($('sahne'), 1920, 1080);

/* ---------- ses (Web Audio ile üretilir; dosya yok) ---------- */
let AC = null, sessiz = false;
function sesAc() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume().catch(() => {}); } catch (_) { AC = null; } }
function ton(f, sure, tip, ses, gecikme) {
  if (sessiz || !AC || AC.state !== 'running') return;
  try {
    const t = AC.currentTime + (gecikme || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = tip || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ses || 0.18, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + sure + 0.05);
  } catch (_) {}
}
const SES = {
  tik: sicak => ton(sicak ? 880 : 660, 0.09, 'square', 0.07),
  katil: () => ton(1320, 0.12, 'sine', 0.06),
  soru: () => { ton(523, 0.14, 'triangle', 0.16); ton(784, 0.2, 'triangle', 0.16, 0.12); },
  dogru: () => [523, 659, 784, 1047].forEach((f, i) => ton(f, 0.28, 'triangle', 0.17, i * 0.09)),
  zafer: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => ton(f, 0.32, 'sawtooth', 0.09, i * 0.14)),
};

/* ---------- durum ---------- */
let faz = 'lobi', idx = -1, duraklat = false, oto = false, sonuc = null, sayimlar = [], toplamOy = 0, kalanMs = 0, sonSaniye = null;
let toplam = {}, oncekiToplam = {}, turBilgi = null, otoT = null, girisT = null, girisBekliyor = false, kapanisT = null, stash = null, adlar = {};
const soru = () => SORULAR[idx];
const puanli = s => Number.isInteger(s && s.dogru);
const SURE_ZORLA = Number(Q.get('sure'));   // ?sure=6: bütün sorular 6 sn (prova/test için)
const sureMs = s => 1000 * (SURE_ZORLA >= 3 ? SURE_ZORLA : s && typeof s.sure === 'number' ? s.sure : A.sure);

/* ---------- soru dosyası denetimi ---------- */
const hatalar = SalonPuan.sorulariDenetle(Y);
if (hatalar.length) {
  $('hataOv').innerHTML = '<h2>⚠ sorular.js hatalı</h2><ul>' + hatalar.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul><p>Dosyayı düzeltip sayfayı yenileyin (F5).</p>';
  $('hataOv').classList.add('on');
}
if (Y) { $('lobiAlt').textContent = Y.altBaslik || ''; if (Y.baslik) { const p = String(Y.baslik).split(' '); $('lobiBaslik').innerHTML = esc(p[0]) + (p.length > 1 ? '<span>' + esc(p.slice(1).join(' ')) + '</span>' : ''); document.title = Y.baslik; } }

/* ---------- Salon altyapısı ---------- */
const salon = Salon.baslat({
  oyunAdi: (Y && Y.baslik) || 'Salon Yarışması', anahtar: 'yarisma', oylamaYolu: 'oylama/', takmaAd: true,
  kumanda: {
    ileri: () => { if (!duraklat) ileri(); },
    geri: () => { if (!duraklat) geri(); },
    duraklat: evet => duraklatAyarla(evet),
    ses: () => sesDegis(),
    oto: () => { if (!duraklat) otoAyarla(!oto); },
    kazan: i => { if (!duraklat) zorla(i); },
    bitir: () => { if (!duraklat && faz === 'soru') kapat(); },
  },
  durum: kumandaDurum,
});
const DEMO = salon.kip === 'demo';
salon.onOyuncular(l => {
  const once = Object.keys(adlar).length;
  adlar = {}; l.forEach(p => { adlar[p.uid] = p.ad; });
  if (l.length > once && faz === 'lobi') SES.katil();
  katilimCiz(l);
});
salon.hazir.then(r => { lobiCiz(r); devamKartiCiz(); }, e => console.warn('[yarisma] salon hazır olmadı', e));

function katilimCiz(l) {
  $('katSay').textContent = l.length; $('lobiSayN').textContent = l.length;
  const box = $('adlar'), mevcut = new Set([...box.children].map(x => x.dataset.uid));
  const adli = l.filter(p => p.ad);
  const son = adli.slice(-13);   // en yeni 13 ad (3 satır); geri kalanı sayıda
  [...box.children].forEach(x => { if (!son.some(p => p.uid === x.dataset.uid)) x.remove(); });
  son.forEach(p => { if (!mevcut.has(p.uid)) { const s = document.createElement('span'); s.dataset.uid = p.uid; s.textContent = p.ad; box.appendChild(s); } else box.querySelector('[data-uid="' + CSS.escape(p.uid) + '"]').textContent = p.ad; });
  let x = box.querySelector('.adsiz'); if (l.length > son.length) { if (!x) { x = document.createElement('span'); x.className = 'adsiz'; x.dataset.uid = '~'; } x.textContent = '+' + (l.length - son.length) + ' kişi'; box.appendChild(x); } else if (x) x.remove();
}
function lobiCiz(r) {
  const q = $('qrBuyuk');
  if (r.kip === 'canli' || r.kip === 'sahte') {
    q.className = ''; q.innerHTML = salon.qrSvg(r.oyUrl);
    const u = r.oyUrl.replace(/^https?:\/\//, ''), kes = u.indexOf('/');
    $('qrUrl').innerHTML = esc(kes > 0 ? u.slice(0, kes) : u) + (kes > 0 ? '<span>' + esc(u.slice(kes)) + '</span>' : '');
    $('qrNot').textContent = r.kip === 'sahte' ? 'Deneme kipi · QR gerçek değil' : 'Kamerayı aç · okut · katıl';
    $('qrKucuk').innerHTML = salon.qrSvg(r.oyUrl);
  } else if (r.kip === 'demo') {
    q.className = 'yok'; q.innerHTML = '👆<br>Tek kişilik demo<br><small>Soru gelince seçeneğe tıkla ya da 1–4</small>';
    $('qrUrl').textContent = ''; $('qrNot').textContent = 'Gerçek etkinlikte salon telefonla oynar';
    $('adimlar').innerHTML = '<li><b>1</b>Tıkla ya da Boşluk: başla</li><li><b>2</b>Seçeneğe tıkla (ya da 1–4)</li><li><b>3</b>Hızlı doğru = daha çok puan</li>';
  } else {
    q.className = 'yok'; q.innerHTML = '📴<br>Çevrimdışı<br><small>Telefonla katılım yok. İnternet gelince F5.</small>';
    $('qrUrl').textContent = ''; $('qrNot').textContent = 'Sorular yine gösterilir; cevap ekranda açıklanır';
  }
  $('ustBilgi').textContent = r.kip === 'sahte' ? 'DENEME KİPİ' : r.kip === 'demo' ? 'DEMO' : r.kip === 'cevrimdisi' ? 'ÇEVRİMDIŞI' : '';
}

/* ---------- kaldığın yerden devam (yalnız canlı kipte; ?yeni=1 sıfırlar) ---------- */
let devamV = null;
function devamKartiCiz() {
  if (Q.has('yeni')) salon.kayit.sil();
  const v = salon.kip === 'canli' ? salon.kayit.oku() : null;
  devamV = v && Number.isInteger(v.idx) && v.idx >= 0 && v.idx < N - 1 && v.toplam && typeof v.toplam === 'object' ? v : null;
  $('devamKart').classList.toggle('on', !!devamV);
  if (devamV) $('devamKart').innerHTML = 'Kayıtlı yarışma: ' + (devamV.idx + 1) + ' / ' + N + ' soru oynandı.<small>Enter: kaldığın yerden (Soru ' + (devamV.idx + 2) + ') · N: kaydı sil, baştan</small>';
}
function ilerlemeKaydet() { if (salon.kip === 'canli') salon.kayit.yaz({ idx, toplam }); }

/* ---------- ekran geçişleri ---------- */
function ekran(id) { document.querySelectorAll('.ekran').forEach(e => e.classList.toggle('on', e.id === id)); salon.odak(id !== 'lobi'); }
function zamanlayiciTemizle() { clearTimeout(otoT); otoT = null; clearTimeout(girisT); girisT = null; girisBekliyor = false; }
function otoPlanla() {
  clearTimeout(otoT); otoT = null;
  if (oto && !duraklat && (faz === 'cevap' || faz === 'tablo')) otoT = setTimeout(() => { otoT = null; if (oto && !duraklat) ileri(); }, A.otoBekleme * 1000);
}

async function soruBaslat(i) {
  zamanlayiciTemizle();
  idx = i; faz = 'giris'; sonuc = null; turBilgi = null; sayimlar = soru().secenekler.map(() => 0); toplamOy = 0; sonSaniye = null;
  const s = soru(), n = s.secenekler.length;
  ekran('soruEkran'); $('soruEkran').className = 'ekran on giris';
  $('soruNo').textContent = 'SORU ' + (i + 1) + ' / ' + N;
  const et = $('soruEtiket'); et.textContent = s.etiket || (puanli(s) ? '' : 'Anket'); et.className = puanli(s) ? '' : 'anket';
  $('soruMetin').textContent = s.soru; $('soruMetin').classList.toggle('uzun', s.soru.length > 70);
  $('aciklama').textContent = s.aciklama || '';
  const box = $('secenekler');
  box.className = (n === 3 ? 'n3' : n === 2 ? 'n2' : '') + (A.canliCubuk ? '' : ' gizliSay') + (DEMO ? ' demo' : '');
  box.innerHTML = s.secenekler.map((o, j) => '<div class="sec ' + HARF[j] + '" data-i="' + j + '"><div class="k">' + (j + 1) + '</div><div class="t">' + esc(o) + '</div><div class="say"></div><div class="cubuk"></div></div>').join('');
  $('sayac').className = ''; $('sayacN').textContent = Math.round(sureMs(s) / 1000); $('sayacHalka').style.strokeDashoffset = 0;
  $('cevapSay').innerHTML = ''; $('cevapBilgi').innerHTML = '';
  $('soruNot').textContent = DEMO ? 'Seçeneğe tıkla ya da 1–4' : salon.kip === 'cevrimdisi' ? 'Çevrimdışı · oy yok' : puanli(s) ? 'Hızlı doğru = daha çok puan' : 'Anket · puan yok';
  $('qrKucuk').classList.toggle('on', salon.kip === 'canli' || salon.kip === 'sahte');
  SES.soru();
  await salon.hazir;
  if (idx !== i || faz !== 'giris') return;
  girisT = setTimeout(() => { girisT = null; if (duraklat) girisBekliyor = true; else oylamaAc(i); }, 1600);
}

function oylamaAc(i) {
  if (idx !== i || faz !== 'giris') return;
  zamanlayiciTemizle();
  const s = soru();
  faz = 'soru'; $('soruEkran').className = 'ekran on';
  const decKey = VoteCore.makeDecKey(i), V = salon.oylama;
  V.onUpdate(u => {
    if (idx !== i || (faz !== 'soru' && faz !== 'kapaniyor')) return;
    if (Array.isArray(u.counts) && u.counts.length === s.secenekler.length) { sayimlar = u.counts.slice(); toplamOy = u.total; }
    kalanMs = u.remainingMs; cubukCiz(); sayacCiz();
    if (faz === 'soru' && u.remainingMs <= 0) kapat();
  });
  const r = V.open({ decKey, q: s.soru, options: s.secenekler.slice(), poll: !puanli(s), durMs: sureMs(s), ipucu: puanli(s) ? s.dogru : undefined });
  if (r && r.then) r.then(x => { if (x && !x.ok) console.warn('[yarisma] oylama açılırken sorun:', x.error); });
}

function cubukCiz() {
  const s = soru(); if (!s) return;
  const p = VoteCore.percents(sayimlar);
  [...$('secenekler').children].forEach((el, j) => {
    el.querySelector('.cubuk').style.width = (toplamOy ? p[j] : 0) + '%';
    el.querySelector('.say').textContent = faz === 'cevap' ? '%' + p[j] : String(sayimlar[j] || 0);
    el.classList.toggle('secim', DEMO && salon.benimOyum() === j);
  });
  const kisi = Object.keys(adlar).length;
  $('cevapSay').innerHTML = salon.kip === 'cevrimdisi' ? '' : '<b>' + toplamOy + '</b>' + (kisi ? ' / ' + kisi : '') + ' cevap';
}
function sayacCiz() {
  const s = soru(), top = sureMs(s), sn = Math.ceil(Math.max(0, kalanMs) / 1000);
  $('sayacN').textContent = sn;
  $('sayacHalka').style.strokeDashoffset = 590.6 * Math.min(1, Math.max(0, 1 - kalanMs / top));
  $('sayac').classList.toggle('sicak', sn <= 5 && sn > 0 && faz === 'soru');
  if (faz === 'soru' && !duraklat && sn !== sonSaniye) { if (sonSaniye !== null && sn <= 5 && sn > 0) SES.tik(sn <= 3); sonSaniye = sn; }
}

// Puanlar: kapanış sonucu (kişi bazlı oylar) → bu turun puanları → toplam. Sonuç telefonlara aynı yazımla gider.
function turHesapla(r) {
  const s = soru();
  const tur = SalonPuan.turPuani(r, puanli(s) ? s.dogru : null, { taban: A.taban, tavan: A.tavan });
  return { decKey: r.decKey, tur, yeni: puanli(s) ? SalonPuan.topla(toplam, tur.puanlar) : toplam };
}
function kapat() {
  if (faz !== 'soru') return;
  const i = idx, s = soru(); faz = 'kapaniyor'; stash = null;
  $('sayac').className = 'bitti'; $('sayacN').textContent = '…';
  let bitti = false;
  const tamam = r => {
    if (bitti || idx !== i || faz !== 'kapaniyor') return; bitti = true; clearTimeout(kapanisT);
    r = r || { counts: sayimlar.slice(), votes: [], winner: null, error: 'zaman aşımı' };
    const h = stash && stash.decKey === r.decKey ? stash : turHesapla(r);
    if (Array.isArray(r.counts) && r.counts.length === s.secenekler.length) { sayimlar = r.counts.slice(); toplamOy = sayimlar.reduce((a, b) => a + b, 0); }
    oncekiToplam = toplam; toplam = h.yeni; turBilgi = h.tur; sonuc = r;
    cevapGoster(r);
  };
  kapanisT = setTimeout(() => tamam(null), 9000);   // ağ ne yaparsa yapsın akış takılmaz
  salon.oylama.close({
    sonucEk: r => { stash = turHesapla(r); return { dogru: puanli(s) ? s.dogru : null, sonucIcin: r.decKey, puan: stash.yeni }; },
  }).then(tamam, e => tamam({ counts: sayimlar.slice(), votes: [], error: String(e) }));
}

function cevapGoster(r) {
  const s = soru(); faz = 'cevap';
  $('soruEkran').className = 'ekran on cevap'; $('sayac').className = 'bitti'; $('sayacN').textContent = '✓';
  let kazananlar;
  if (puanli(s)) kazananlar = [s.dogru];
  else { const mx = Math.max(...sayimlar); kazananlar = mx > 0 ? sayimlar.map((c, j) => c === mx ? j : -1).filter(j => j >= 0) : []; }
  [...$('secenekler').children].forEach((el, j) => { el.classList.toggle('dogru', kazananlar.includes(j)); el.classList.toggle('yanlis', !kazananlar.includes(j)); });
  cubukCiz();
  const b = $('cevapBilgi');
  if (salon.kip === 'cevrimdisi') b.innerHTML = puanli(s) ? 'Doğru cevap: <em>' + esc(s.secenekler[s.dogru]) + '</em>' : 'Çevrimdışı: oy toplanmadı';
  else if (puanli(s)) {
    const n = turBilgi.dogrular.length, t = toplamOy, hz = turBilgi.enHizli;
    b.innerHTML = '<em>✓ ' + n + ' kişi bildi</em>' + (t ? ' (%' + Math.round(100 * n / t) + ')' : '') + (hz ? ' · En hızlı: ' + esc(SalonPuan.gorunenAd(hz.uid, adlar)) + ' ' + (hz.ms / 1000).toFixed(1).replace('.', ',') + ' sn' : '');
    if (DEMO) { const m = salon.benimOyum(); b.innerHTML += m === null ? ' · Cevap vermedin' : m === s.dogru ? ' · <em>Sen de bildin! +' + (turBilgi.puanlar.sen || 0) + '</em>' : ' · Bu sefer olmadı'; }
  } else b.innerHTML = toplamOy ? 'Salon böyle düşünüyor · ' + toplamOy + ' oy' : 'Oy gelmedi';
  SES.dogru();
  ilerlemeKaydet();
  otoPlanla();
}

function tabloGoster() {
  zamanlayiciTemizle(); faz = 'tablo'; ekran('tabloEkran');
  const l = SalonPuan.siralama(toplam, adlar), once = SalonPuan.siralama(oncekiToplam, adlar), onceSira = {};
  once.forEach(x => { onceSira[x.uid] = x.sira; });
  $('tabloAlt').textContent = 'Soru ' + (idx + 1) + ' / ' + N + ' sonrası · ' + l.length + ' oyuncu';
  $('tablo').innerHTML = l.slice(0, 7).map((x, k) => {
    const art = turBilgi && turBilgi.puanlar[x.uid] || 0, os = onceSira[x.uid];
    const ok = os && os > x.sira ? '<span class="ok">▲' + (os - x.sira) + '</span>' : os && os < x.sira ? '<span class="ok as">▼' + (x.sira - os) + '</span>' : '';
    return '<div class="satir" style="animation-delay:' + (k * 0.07) + 's"><span class="s">' + x.sira + '.</span><span class="ad">' + esc(x.ad) + ok + '</span><span class="art' + (art ? '' : ' sifir') + '">' + (art ? '+' + art : '—') + '</span><span class="p">' + x.puan + '</span></div>';
  }).join('');
  $('tabloBos').textContent = l.length ? '' : salon.kip === 'cevrimdisi' ? 'Çevrimdışı: puan toplanmadı.' : 'Henüz kimse puan almadı.';
  otoPlanla();
}

function finalGoster() {
  zamanlayiciTemizle(); faz = 'final'; ekran('finalEkran');
  const l = SalonPuan.siralama(toplam, adlar).filter(x => x.puan > 0);
  $('finalAlt').textContent = l.length ? N + ' soru · ' + Object.keys(toplam).length + ' oyuncu · tebrikler!' : 'Bu oturumda puan toplanmadı';
  const pod = [l[1], l[0], l[2]], sinif = ['b2', 'b1', 'b3'], no = [2, 1, 3];
  $('podyum').innerHTML = pod.map((x, k) => x ? '<div class="basamak ' + sinif[k] + '"><div class="kim">' + esc(x.ad) + '</div><div class="pp">' + x.puan + ' puan</div><div class="blok">' + no[k] + '</div></div>' : '<div class="basamak ' + sinif[k] + '" style="visibility:hidden"><div class="blok"></div></div>').join('');
  $('digerleri').innerHTML = l.slice(3, 7).map(x => '<span>' + x.sira + '.<b>' + esc(x.ad) + '</b>' + x.puan + '</span>').join('');
  if (l.length) { SES.zafer(); konfeti(); }
  salon.kayit.sil();
}
function konfeti() {
  const s = $('finalEkran'), renk = ['#ffd23f', '#00e5ff', '#6c3ef0', '#e8336f', '#21d07a', '#ffffff'];
  for (let i = 0; i < 60; i++) {
    const k = document.createElement('i'); k.className = 'konfeti';
    k.style.left = (Math.random() * 1780) + 'px'; k.style.background = renk[i % renk.length];
    k.style.animationDuration = (2.8 + Math.random() * 2.6) + 's'; k.style.animationDelay = (1.2 + Math.random() * 2.2) + 's';
    s.appendChild(k); setTimeout(() => k.remove(), 8000);
  }
}

/* ---------- gezinme ---------- */
function ileri() {
  if (hatalar.length) return;
  if (faz === 'lobi') { if (devamV) devamEt(); else soruBaslat(0); }
  else if (faz === 'giris') { if (girisT || girisBekliyor) oylamaAc(idx); }
  else if (faz === 'soru') kapat();
  else if (faz === 'cevap') {
    const tabloVar = A.tablo && puanli(soru()) && idx < N - 1;
    if (idx >= N - 1) finalGoster(); else if (tabloVar) tabloGoster(); else soruBaslat(idx + 1);
  }
  else if (faz === 'tablo') { if (idx >= N - 1) finalGoster(); else soruBaslat(idx + 1); }
}
function geri() {
  if (faz === 'tablo') { zamanlayiciTemizle(); faz = 'cevap'; ekran('soruEkran'); $('soruEkran').className = 'ekran on cevap'; otoPlanla(); }
  else if (faz === 'final') { zamanlayiciTemizle(); faz = 'cevap'; ekran('soruEkran'); $('soruEkran').className = 'ekran on cevap'; }
}
function devamEt() {
  const v = devamV; devamV = null; $('devamKart').classList.remove('on');
  toplam = v.toplam; oncekiToplam = v.toplam; soruBaslat(v.idx + 1);
}
function zorla(i) {
  if (!(i >= 0 && i < (soru() ? soru().secenekler.length : 0))) return;
  if (DEMO) { if (faz === 'soru' && salon.demoOy(i)) cubukCiz(); return; }   // demo: 1–4 kendi oyun
  if (faz === 'soru') salon.oylama.forceWin(i);   // süre ~1,5 sn'ye iner (ankette o seçenek öne çıkar)
}
function duraklatAyarla(evet) {
  evet = !!evet; if (evet === duraklat) return;
  duraklat = evet; $('durakOv').classList.toggle('on', duraklat);
  if (salon.oylama) (duraklat ? salon.oylama.pause() : salon.oylama.resume());
  if (duraklat) { clearTimeout(otoT); otoT = null; }
  else { if (girisBekliyor) { girisBekliyor = false; oylamaAc(idx); } otoPlanla(); }
}
function otoAyarla(v) { oto = !!v; $('otoRozet').classList.toggle('on', oto); otoPlanla(); }
function sesDegis() { sessiz = !sessiz; }
let sifirT = 0;
function sifirla() {   // R iki kez (2 sn içinde): yarışmayı baştan
  if (Date.now() - sifirT > 2000) { sifirT = Date.now(); salon.durumYaz('Yarışmayı sıfırlamak için R\'ye tekrar bas', 'off', 2500); return; }
  zamanlayiciTemizle(); clearTimeout(kapanisT);
  if (faz === 'soru') salon.oylama.close();
  toplam = {}; oncekiToplam = {}; idx = -1; faz = 'lobi'; salon.kayit.sil(); devamV = null; $('devamKart').classList.remove('on');
  ekran('lobi');
}

function kumandaDurum() {
  const s = soru(), fz = { soru: 'vote', kapaniyor: 'closing', cevap: 'result', giris: 'freeze' }[faz] || '';
  const sonraki = faz === 'lobi' ? 'Soru 1: ' + (SORULAR[0] ? SORULAR[0].soru : '') : faz === 'cevap' && A.tablo && puanli(s) && idx < N - 1 ? 'Sıralama' : idx + 1 < N ? 'Soru ' + (idx + 2) + ': ' + SORULAR[idx + 1].soru : faz === 'final' ? '' : 'Kazananlar';
  return {
    pos: Math.max(0, idx), toplam: N, faz: fz, duraklat, oto, sessiz,
    kim: faz === 'lobi' ? 'LOBİ' : faz === 'tablo' ? 'SIRALAMA' : faz === 'final' ? 'FİNAL' : 'SORU ' + (idx + 1),
    metin: faz === 'lobi' ? Object.keys(adlar).length + ' kişi katıldı' : faz === 'final' ? 'Kazananlar ekranda' : faz === 'tablo' ? 'Sıralama ekranda' : s ? s.soru : '',
    karar: s && (faz === 'soru' || faz === 'kapaniyor' || faz === 'cevap') ? { q: s.soru, o: s.secenekler, c: sayimlar, kalan: Math.ceil(Math.max(0, kalanMs) / 1000), acik: faz === 'soru' } : null,
    sonraki,
  };
}

/* ---------- tuşlar ve tıklama (U / Shift+U'yu Salon yönetir) ---------- */
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key; sesAc();
  if (k === 'f' || k === 'F') { salon.tamEkran(); return; }
  if (k === 'm' || k === 'M') { sesDegis(); return; }
  if (k === 'p' || k === 'P') { duraklatAyarla(!duraklat); return; }
  if (duraklat) return;
  if (faz === 'lobi' && devamV && (k === 'n' || k === 'N')) { salon.kayit.sil(); devamV = null; $('devamKart').classList.remove('on'); return; }
  if (k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); ileri(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); geri(); }
  else if (k >= '1' && k <= '4') zorla(+k - 1);
  else if (k === 'o' || k === 'O') otoAyarla(!oto);
  else if (k === 'r' || k === 'R') sifirla();
});
$('sahne').addEventListener('click', e => {
  sesAc(); if (duraklat) return;
  const sec = e.target.closest('.sec');
  if (DEMO && sec && faz === 'soru') { zorla(+sec.dataset.i); return; }
  if (faz === 'soru' || faz === 'kapaniyor') return;   // tıklama oylamayı asla kapatmaz (demo: seçenek dışına dokunma)
  if (DEMO || faz === 'lobi') ileri();   // projektörde tıklama yalnız lobide başlatır
});

window.YARISMA_DURUM = () => ({ faz, idx, toplam: Object.assign({}, toplam), kip: salon.kip, oyuncu: Object.keys(adlar).length, sayimlar: sayimlar.slice() });   // testler için
})();
</script>
</body>
