name: yayin
# Oyunu ve oy sayfasını Cloudflare Pages'e (cenga-mezuniyet.pages.dev) yayınlar.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: yayin, cancel-in-progress: false }
jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Site derlemesi (dist/)
        run: node site/build.mjs
      - name: Cloudflare Pages'e yükle
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Yayın atlandı::Cloudflare anahtarları tanımlı değil. Repo > Settings > Secrets and variables > Actions altına CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit yetkili API token) ve CLOUDFLARE_ACCOUNT_ID (Cloudflare hesap kimliği) ekleyin. Derleme başarılı; yalnız yükleme yapılmadı."
            exit 0
          fi
          npx -y wrangler@3 pages deploy dist --project-name=cenga-mezuniyet --branch=main --commit-dirty=true
