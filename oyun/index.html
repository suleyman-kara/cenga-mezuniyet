.cloud{animation:drift 60s linear infinite}.cloud.c2{animation-duration:85s;animation-delay:-40s}.cloud.c3{animation-duration:48s;animation-delay:-20s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.shaft{animation:shaftA 4s ease-in-out infinite alternate}
.mote{animation:moteA 9s ease-in-out infinite}
.stm{transform-box:fill-box;transform-origin:50% 100%;animation:steamA 2.4s ease-out infinite;opacity:0}
.stk{transform-box:fill-box;transform-origin:50% 0;animation:stkW 4.6s ease-in-out infinite}
.code{animation:codeA 3s linear infinite}
.led{animation:blink 1s steps(2) infinite}
.bird{animation:birdA 22s linear infinite}
.bird path{transform-box:fill-box;transform-origin:50% 50%;animation:flap .3s ease-in-out infinite alternate}
.hs{transform-box:view-box;animation:spin 60s steps(60) infinite}
.lampS{animation:lampS 2.6s ease-in-out infinite alternate}
.drip{animation:dripA 3.2s ease-in infinite;opacity:0}
.fan{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.flk{animation:flk .5s steps(3) infinite}
.zz{animation:zzz 2.6s ease-out infinite;opacity:0}
/* geçiş perdesi: yapışkan not şeritleri */
#wipe{position:absolute;top:-15%;bottom:-15%;left:-30%;width:160%;pointer-events:none;z-index:9;transform:translateX(-125%) skewX(-14deg);background:linear-gradient(90deg,#ff6f61 0 7%,#ffc93c 7% 13%,#1fb5a8 13% 18%,#fff6dc 18% 82%,#1fb5a8 82% 87%,#ffc93c 87% 93%,#ff6f61 93%)}
#wipe.in{animation:wipeIn .34s cubic-bezier(.6,0,.9,.5) forwards}
#wipe.out{animation:wipeOut .45s cubic-bezier(.1,.5,.4,1) forwards}

/* karakterler */
#cast{position:absolute;inset:0;pointer-events:none}
.ch{position:absolute;bottom:280px;width:230px;height:483px;margin-left:-115px;will-change:transform;transition:left var(--wt,1.2s) var(--we,linear),bottom .45s cubic-bezier(.3,0,.5,1)}
.ch .fc,.ch .mv{position:absolute;inset:0}
.ch .fc{transition:transform .26s cubic-bezier(.5,-.4,.5,1.4)}
.ch.fl .fc{transform:scaleX(-1)}
.ch .mv{transform-origin:50% 100%;transition:transform .35s cubic-bezier(.4,-.2,.4,1.3)}
.ch svg{width:100%;height:100%;overflow:visible}
.ch:before{content:"";position:absolute;left:50%;bottom:-12px;width:170px;height:28px;margin-left:-85px;border-radius:50%;background:rgba(60,40,10,.2)}
.ch .jump,.ch .up,.ch .legL,.ch .legR,.ch .armL,.ch .armR,.ch .head,.ch .mouth,.ch .eyes,.ch .lk,.ch .brows path,.ch .pL,.ch .pR,.ch .sweat,.ch .keyr,.ch .ring path,.ch .tear{transform-box:fill-box}
.ch .jump{transform-origin:50% 100%;animation:bob 3s ease-in-out var(--d,0s) infinite}
.ch .up{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out var(--d,0s) infinite}
.ch .legL,.ch .legR{transform-origin:50% 0}
/* kollar omuzdan, eldeki eşya elden döner: dönme merkezi sabit koordinatta (fill-box aksesuarla kayıyordu) */
.ch .armL,.ch .armR,.ch .pL,.ch .pR,.ch .head{transform-box:view-box!important}
.ch .armL{transform-origin:45px 160px}.ch .armR{transform-origin:155px 160px}
.ch .armL,.ch .armR{transition:transform .5s cubic-bezier(.45,-.55,.35,1.55)}
.ch .pL{transform-origin:45px 270px}.ch .pR{transform-origin:155px 270px}
.ch .pL,.ch .pR{transition:transform .5s cubic-bezier(.45,-.55,.35,1.55)}
.ch .head{transform-origin:100px 140px;transition:transform .4s cubic-bezier(.4,-.3,.4,1.4)}
.ch .mouth{transform-origin:50% 50%;transition:opacity .15s}
.ch .eyes{transform-origin:50% 50%;animation:blinkEye 4.2s var(--d,0s) infinite}
.ch .lk{transition:transform .3s ease-out}
.ch.see .lk{transform:translateX(7px)}
.ch .scrn{animation:scrG 1.1s ease-in-out infinite alternate}
.ch .keyr{transform-origin:50% 0;animation:keysA .5s ease-in-out infinite alternate}
.ch .ring{opacity:0}
.ch .ring path{transform-origin:50% 50%;animation:ringW .5s ease-out infinite}
.ch .tear{opacity:0}
.ch .dust{position:absolute;bottom:-8px;left:50%;width:46px;height:30px;margin-left:-23px;border-radius:50%;background:rgba(200,170,120,.8);animation:dustP .6s ease-out forwards}
/* yüz ifadeleri */
.ch .brows path{transform-origin:50% 50%;transition:transform .3s cubic-bezier(.4,-.4,.4,1.5)}
.ch .smile,.ch .frown,.ch .mO,.ch .smirk,.ch .sweat,.ch .blush{opacity:0;transition:opacity .25s}
.ch[data-ex=happy] .bL{transform:translateY(-5px) rotate(-6deg)}.ch[data-ex=happy] .bR{transform:translateY(-5px) rotate(6deg)}
.ch[data-ex=happy] .blush{opacity:.45}
.ch[data-ex=sad] .bL,.ch[data-ex=worried] .bL{transform:rotate(-16deg) translateY(-2px)}
.ch[data-ex=sad] .bR,.ch[data-ex=worried] .bR{transform:rotate(16deg) translateY(-2px)}
.ch[data-ex=worried] .sweat,.ch[data-ex=shock] .sweat{opacity:1;animation:sweatD 1.4s ease-in infinite}
.ch[data-ex=shock] .bL,.ch[data-ex=shock] .bR{transform:translateY(-10px)}
.ch[data-ex=skeptic] .bL{transform:translateY(2px) rotate(5deg)}.ch[data-ex=skeptic] .bR{transform:translateY(-11px) rotate(-8deg)}
.ch[data-ex=smug] .bL{transform:translateY(-6px) rotate(-4deg)}.ch[data-ex=smug] .bR{transform:translateY(2px) rotate(-8deg)}
.ch[data-ex=stern] .bL{transform:translateY(3px) rotate(14deg)}.ch[data-ex=stern] .bR{transform:translateY(3px) rotate(-14deg)}
.ch[data-ex=happy]:not(.talk) .smile,.ch[data-ex=sad]:not(.talk) .frown,.ch[data-ex=worried]:not(.talk) .frown,.ch[data-ex=shock]:not(.talk) .mO,.ch[data-ex=smug]:not(.talk) .smirk{opacity:1}
.ch[data-ex=happy]:not(.talk) .mouth,.ch[data-ex=sad]:not(.talk) .mouth,.ch[data-ex=worried]:not(.talk) .mouth,.ch[data-ex=shock]:not(.talk) .mouth,.ch[data-ex=smug]:not(.talk) .mouth{opacity:0}
/* pozlar */
.ch[data-act=point] .armR{transform:rotate(-82deg)}.ch[data-act=point] .armL{transform:rotate(5deg)}
.ch[data-act=wave] .armR{animation:wave .3s ease-in-out infinite alternate}
.ch[data-act=think] .armR{transform:rotate(172deg) scaleY(.68)}.ch[data-act=think] .head{transform:rotate(5deg)}.ch[data-act=think] .lk{transform:translate(5px,-5px)}
.ch[data-act=cheer] .armL{transform:rotate(155deg)}.ch[data-act=cheer] .armR{transform:rotate(-155deg)}.ch[data-act=cheer] .jump{animation:jump .4s ease-out infinite alternate}
.ch[data-act=panic] .armL{animation:panicL .14s infinite alternate}.ch[data-act=panic] .armR{animation:panicR .14s infinite alternate}.ch[data-act=panic] .jump{animation:jump .22s ease-out infinite alternate}

*{box-sizing:border-box;margin:0;padding:0}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#fff3d6;--mono:Consolas,"Cascadia Mono","DejaVu Sans Mono","Courier New",monospace;--hand:"Segoe Print","Comic Sans MS","Comic Neue",cursive;--serif:Georgia,"Times New Roman",serif;--ink:#1d2a4a;--li:#0a66c2}

#stage[data-v=aksam] .vo-aksam,#stage[data-v=asistan] .vo-asistan,#stage[data-v=lobi] .vo-lobi,#stage[data-v=gece] .vo-gece,#stage[data-v=pizza] .vo-pizza{display:inline}
#stage.inst .ia,#stage.inst .ia *,#stage.inst #panel *,#stage.inst #bg *,#stage.inst #fore *{animation-delay:-60s!important}

.mailkutu .mr b{width:330px;flex:none;font:900 32px "Segoe UI",sans-serif}
.mailkutu .mr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* jira */
.jira{width:1080px;background:#f4f5f7;border:5px solid #253858;border-radius:20px;overflow:hidden;box-shadow:0 14px 0 rgba(37,56,88,.25)}
.jira .wbar{background:#0052cc}
.jira .cols{display:flex;gap:18px;padding:20px}
.jira .col{flex:1;background:#ebecf0;border-radius:14px;padding:14px;min-height:400px}
.jira .col h5{font:900 26px "Segoe UI",sans-serif;color:#5e6c84;letter-spacing:1px;margin-bottom:10px}
.jira .tk{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;font:700 28px "Segoe UI",sans-serif;box-shadow:0 2px 0 rgba(9,30,66,.2);display:flex;align-items:center;gap:10px}
.jira .tk i{width:34px;height:34px;border-radius:50%;background:#ff6f61;color:#fff;font:900 20px/34px "Segoe UI",sans-serif;text-align:center;font-style:normal;margin-left:auto;flex:none}
.jira .big{font:900 120px var(--mono);color:#d0261a;text-align:center;line-height:1}
.jira .big small{display:block;font:800 30px "Segoe UI",sans-serif;color:#5e6c84}
.jk{width:900px;background:#fff;border:5px solid #253858;border-left:18px solid #ff5630;border-radius:18px;padding:28px 36px;box-shadow:0 14px 0 rgba(37,56,88,.25)}
.jk .kd{font:800 32px var(--mono);color:#0052cc}
.jk h3{font:900 64px "Segoe UI",sans-serif;color:#172b4d;margin:8px 0 18px}
.jk .rw{display:flex;justify-content:space-between;font:700 36px "Segoe UI",sans-serif;color:#5e6c84;padding:10px 0;border-top:3px solid #ebecf0}
.jk .rw b{color:#172b4d}.jk .rw b.r{color:#d0261a}
/* leetcode */
.lc{width:820px;background:#1a1a1a;border:5px solid #3a3a3a;border-radius:24px;color:#eff1f6;padding:30px 40px;box-shadow:0 14px 0 rgba(0,0,0,.3)}
.lc .lg{font:900 34px "Segoe UI",sans-serif;color:#ffa116}
.lc .rw{display:flex;align-items:center;gap:26px;margin-top:20px}
.lc .fl{width:150px;height:170px}
.lc .gn b{display:block;font:900 110px/1 var(--mono);color:#ffa116}
.lc .gn small{font:800 32px "Segoe UI",sans-serif;color:#aaa}
.lc .zr{display:inline-block;font:900 34px "Segoe UI",sans-serif;padding:6px 20px;border-radius:12px;background:#ff375f22;color:#ff375f;margin-top:20px}
.lc .zr.m{background:#ffc01e22;color:#ffc01e}
.lc .ok{font:900 50px "Segoe UI",sans-serif;color:#2cbb5d;margin-top:14px}
/* fotokopi sayacı */
.fk{width:620px;background:#e8ecef;border:6px solid #5a7286;border-radius:26px;padding:30px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.2)}
.fk small{display:block;font:800 34px "Segoe UI",sans-serif;color:#5a7286}
.fk b{display:block;margin:16px 0;font:900 150px/1.1 var(--mono);color:#7df9c4;background:#14213d;border-radius:18px;padding:10px 0;letter-spacing:6px}
.fk em{font-style:normal;font:800 30px "Segoe UI",sans-serif;color:#d0261a}
/* kartvizit */
.kv{width:820px;height:460px;background:#fff;border-radius:16px;box-shadow:0 22px 40px rgba(0,0,0,.35);padding:56px 60px;transform:rotate(-4deg);position:relative;overflow:hidden}
.kv:before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:#1d2a4a}
.kv .lgk{display:flex;align-items:center;gap:14px;font:900 34px "Segoe UI",sans-serif;color:#1d2a4a}
.kv .lgk i{width:48px;height:48px;border-radius:50%;background:#1d2a4a;position:relative}
.kv .lgk i:after{content:"";position:absolute;left:14px;top:8px;border:10px solid transparent;border-bottom:22px solid #ffc93c;border-top:0}
.kv h3{font:900 76px "Segoe UI",sans-serif;color:#1d2433;margin-top:60px}
.kv p{font:700 40px "Segoe UI",sans-serif;color:#56607a}
.kv.yg .ys{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(230,150,40,.55),rgba(230,150,40,.15) 70%,transparent)}
/* insta */
.insta{width:460px;height:720px;border-radius:30px;overflow:hidden;background:#222;border:5px solid #111;box-shadow:0 18px 0 rgba(0,0,0,.25)}
.insta .bars{position:absolute;left:16px;right:16px;top:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.4)}
.insta .bars i{display:block;height:100%;width:60%;background:#fff;border-radius:3px}
.insta .ih{position:absolute;left:20px;top:34px;display:flex;align-items:center;gap:12px;color:#fff;font:800 30px "Segoe UI",sans-serif}
.insta .ih .av{width:60px;height:60px;border:3px solid #ff4fa3}
.insta .ph2{position:absolute;inset:0}
.insta .ph2 svg{width:100%;height:100%}
.insta .st{position:absolute;left:30px;right:30px;bottom:110px;background:#fff;color:#111;font:900 38px/1.2 "Segoe UI",sans-serif;padding:16px 20px;border-radius:14px;text-align:center;transform:rotate(-3deg)}
/* staj defteri */
.defter{width:900px;background:#fffdf3 repeating-linear-gradient(180deg,transparent 0 66px,#d5e4f2 66px 69px);border:5px solid #6b4a2a;border-left:40px solid #8a3a2a;border-radius:12px;padding:30px 40px 40px;box-shadow:0 14px 0 rgba(60,40,10,.25);transform:rotate(-1.5deg)}
.defter h4{font:900 40px var(--serif);color:#8a3a2a;letter-spacing:4px;margin-bottom:10px}
.defter .dr{font:600 38px/69px var(--serif);color:#1d2433}
.defter .im{font:700 38px/69px var(--serif);color:#1d2433}
.defter .nt{position:absolute;right:-30px;bottom:30px;font:700 48px var(--hand);color:#c0392b;transform:rotate(-10deg);opacity:0}
.defter.not .nt,.defter .nt.on{opacity:1;animation:pop .45s both}
/* afiş */
.afis{width:620px;height:720px;background:#1a1f3a;border-radius:10px;overflow:hidden;box-shadow:0 22px 40px rgba(0,0,0,.35);transform:rotate(2deg)}
.afis .t1{position:absolute;left:0;top:0;right:0;height:360px;background:#ffc93c}
.afis .t2{position:absolute;right:-80px;top:120px;width:360px;height:360px;border-radius:50%;background:#1fb5a8}
.afis .t3{position:absolute;left:0;bottom:0;right:0;height:300px;background:linear-gradient(160deg,transparent 40%,#ff6f61 40%)}
.afis h3{position:absolute;left:40px;top:60px;width:440px;font:900 84px/1 "Segoe UI",sans-serif;color:#1a1f3a}
.afis .ss{position:absolute;left:40px;top:400px;font:800 40px/1.35 "Segoe UI",sans-serif;color:#fff}
.afis .al{position:absolute;right:30px;bottom:40px;font:900 48px var(--hand);color:#fff;transform:rotate(-6deg)}
.afis .cg{position:absolute;left:40px;bottom:40px;font:900 28px var(--mono);color:#ffc93c;letter-spacing:4px}
/* excel */
.tablo{width:1180px;background:#fff;border:5px solid #1d6f42;border-radius:16px;overflow:hidden;box-shadow:0 14px 0 rgba(29,111,66,.25)}
.tablo .wbar{background:#1d6f42}
.tablo .ws{height:470px;overflow:hidden;position:relative}
.tablo table{width:100%;border-collapse:collapse;font:700 30px "Segoe UI",sans-serif}
.tablo th{background:#e6f2ea;color:#1d6f42;font:900 28px "Segoe UI",sans-serif;text-align:left;padding:10px 14px;border:2px solid #cfe3d6}
.tablo td{padding:12px 14px;border:2px solid #e3e8e5;white-space:nowrap}
.tablo td:last-child{color:#c0392b;font-weight:800}
.tablo .tt{background:#e6f2ea;padding:14px 20px;font:900 34px var(--mono);color:#1d6f42;display:flex;justify-content:space-between}
.tablo.kay tbody{animation:kayA 6s linear both}
@keyframes kayA{from{transform:translateY(0)}to{transform:translateY(-1400px)}}
/* dosya */
.dosya{width:1040px;display:flex;gap:30px;align-items:center;background:#fff;border:5px solid var(--ink);border-radius:22px;padding:30px 36px;box-shadow:0 14px 0 rgba(29,42,74,.22)}
.dosya .ic{width:170px;height:210px;flex:none;position:relative}
.dosya .ic svg{width:100%;height:100%}
.dosya b{display:block;font:900 42px/1.15 "Segoe UI",sans-serif;color:var(--ink);word-break:break-word}
.dosya small{display:block;font:700 32px "Segoe UI",sans-serif;color:#56607a;margin-top:10px}
.dosya .yb{height:26px;border-radius:13px;background:#e1e5ee;margin-top:18px;overflow:hidden}
.dosya .yb i{display:block;height:100%;background:linear-gradient(90deg,#1fb5a8,#0a66c2);transform-origin:0 50%;animation:barF 2.6s .5s ease-in-out both}
.dosya .yb+em{display:block;font-style:normal;font:900 30px "Segoe UI",sans-serif;color:#0f8a5f;margin-top:8px;animation:fadeIn .3s 3.2s both}
/* fiş */
.fis{width:560px;background:#fffef8;padding:40px 40px 60px;box-shadow:0 18px 30px rgba(0,0,0,.25);transform:rotate(2deg);font-family:var(--mono);color:#222;-webkit-mask:radial-gradient(circle 14px at 50% 100%,transparent 98%,#000) 0 0/40px 100% repeat-x;mask:linear-gradient(#000,#000)}
.fis h4{text-align:center;font:900 40px var(--mono);letter-spacing:4px;border-bottom:4px dashed #999;padding-bottom:16px}
.fis .fr{display:flex;justify-content:space-between;font:700 38px var(--mono);padding:14px 0}
.fis .tp{display:flex;justify-content:space-between;font:900 50px var(--mono);border-top:4px dashed #999;padding-top:16px;margin-top:10px}
.fis .tsk{text-align:center;font:700 28px var(--mono);color:#777;margin-top:20px}
/* whatsapp */
.wa{width:860px;height:760px;display:flex;flex-direction:column;background:#efe7dc;border:5px solid #075e54;border-radius:26px;overflow:hidden;box-shadow:0 14px 0 rgba(7,94,84,.25)}
.wa .wbar{background:#075e54;height:86px}
.wa .wbar b{display:block;font:900 32px "Segoe UI",sans-serif}
.wa .wbar small{display:block;font:600 22px "Segoe UI",sans-serif;opacity:.85}
.wa .ms{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:20px 24px;overflow:hidden}
.wa .m{align-self:flex-start;max-width:92%;background:#fff;border-radius:18px;padding:10px 20px 12px;font:600 34px/1.22 "Segoe UI",sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.12);animation:lineIn .3s both}
.wa .m b{display:block;font:900 24px "Segoe UI",sans-serif;color:#d0261a}
.wa .m.yz{background:#dcf8c6;font-style:italic;color:#56607a}
.wa .m.yz.st{animation:lineIn .3s both,fadeOut .4s forwards}
/* davet + döviz */
.davet{width:900px;background:#fff;border:5px solid var(--ink);border-left:20px solid #7a3fb0;border-radius:18px;padding:30px 40px;box-shadow:0 14px 0 rgba(29,42,74,.22)}
.davet small{font:800 28px "Segoe UI",sans-serif;color:#7a3fb0;letter-spacing:2px}
.davet h3{font:900 64px "Segoe UI",sans-serif;color:var(--ink);margin:6px 0}
.davet .sa{font:900 80px var(--mono);color:#d0261a}
.davet p{font:700 32px "Segoe UI",sans-serif;color:#56607a}
.davet .bt{display:flex;gap:20px;margin-top:18px}.davet .bt i{font-style:normal;font:900 30px "Segoe UI",sans-serif;padding:10px 26px;border-radius:12px;background:#1fae5b;color:#fff}.davet .bt i+i{background:#eee;color:#999}
.doviz{width:440px;height:300px;background:#0f1a14;border:5px solid #1fae5b;border-radius:20px;padding:16px}
.doviz b{font:900 30px var(--mono);color:#7df9c4}
.doviz svg{width:100%;height:220px}
.doviz path.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:strD 3s .4s ease-out forwards}
/* takvim */
.takvim{width:520px;height:600px}
.takvim .pg{position:absolute;inset:0;background:#fff;border:6px solid var(--ink);border-radius:22px;box-shadow:0 14px 0 rgba(29,42,74,.22);overflow:hidden}
.takvim .pg .hd{height:110px;background:#ff6f61}
.takvim .pg .hd:before,.takvim .pg .hd:after{content:"";position:absolute;top:-20px;width:26px;height:60px;border-radius:13px;background:var(--ink)}
.takvim .pg .hd:before{left:120px}.takvim .pg .hd:after{right:120px}
.takvim .pg b{display:block;text-align:center;font:900 190px/400px var(--mono);color:var(--ink)}
.takvim .pg.f{animation:pageFly 1s ease-in both}
@keyframes pageFly{0%{transform:none}100%{transform:translate(700px,-500px) rotate(70deg);opacity:0}}
/* dm */
.dm{width:960px;background:#fff;border:5px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 14px 0 rgba(29,42,74,.22)}
.dm .wbar{background:linear-gradient(90deg,#7a3fb0,#ff4fa3)}
.dm .bb{margin:30px;background:#efe9ff;border-radius:26px 26px 26px 6px;padding:24px 30px;font:700 44px/1.25 "Segoe UI",sans-serif;color:#1d2433;animation:lineIn .4s .4s both}
/* kayıt */
.kayit{width:1000px;height:560px}
.kayit .ek{position:absolute;left:0;top:0;width:760px;background:#fff;border:5px solid #1b4a7a;border-radius:18px;overflow:hidden;box-shadow:0 14px 0 rgba(27,74,122,.22)}
.kayit .ek .wbar{background:#1b4a7a}
.kayit .ek h3{font:900 52px "Segoe UI",sans-serif;color:#1b4a7a;padding:30px 34px 0}
.kayit .ek p{font:900 44px "Segoe UI",sans-serif;color:#0f8a5f;padding:16px 34px 40px}
.kayit .zf{position:absolute;right:0;bottom:0;width:440px;height:260px;background:#d9c08a;border:5px solid #7a5a22;transform:rotate(-6deg);box-shadow:0 14px 26px rgba(0,0,0,.3);animation:pnIn .5s .8s both}
.kayit .zf:before{content:"";position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(160deg,transparent 49%,#c9ad72 50%),linear-gradient(200deg,transparent 49%,#c9ad72 50%);background-size:50% 100%;background-repeat:no-repeat;background-position:left,right}
.kayit .zf b{position:absolute;left:30px;bottom:30px;font:900 40px var(--serif);color:#5a3a12}
.kayit .zf i{position:absolute;right:30px;top:30px;width:80px;height:90px;border:4px dashed #7a5a22;border-radius:6px}
/* etkinlik */
.etk{width:960px;background:#fff;border:5px solid #c22e4b;border-radius:22px;overflow:hidden;box-shadow:0 14px 0 rgba(194,46,75,.2)}
.etk .im{height:200px;background:linear-gradient(120deg,#1fb5a8,#0a66c2);position:relative}
.etk .im b{position:absolute;left:34px;bottom:20px;font:900 56px "Segoe UI",sans-serif;color:#fff}
.etk .bd{padding:24px 34px}
.etk p{font:700 38px "Segoe UI",sans-serif;color:#34405e}
.etk .kt{display:flex;align-items:center;gap:8px;margin-top:16px}
.etk .kt .av{width:64px;height:64px;margin-right:-24px;border:4px solid #fff}
.etk .kt b{margin-left:40px;font:900 40px "Segoe UI",sans-serif;color:#c22e4b}
.etk .bt{display:inline-block;margin-top:18px;font:900 34px "Segoe UI",sans-serif;color:#fff;background:#c22e4b;border-radius:14px;padding:10px 30px}
/* cv3 */
.cv3{width:1160px}
.cv3 .ks{display:flex;gap:30px;justify-content:center;padding:10px 0 20px}
.cv3 .k{width:300px;height:380px;background:#fff;border:4px solid #c9c2b0;border-radius:10px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.08);animation:boxIn .45s both}
.cv3 .k b{display:block;font:900 34px "Segoe UI",sans-serif;color:var(--ink)}
.cv3 .k i{display:block;height:16px;border-radius:8px;background:#e1e5ee;margin-top:16px}
.cv3 .k em{display:block;margin-top:40px;font-style:normal;font:800 26px "Segoe UI",sans-serif;color:#56607a}
.cv3 .k strong{display:block;font:900 32px "Segoe UI",sans-serif;color:#0f8a5f}
.cv3 .rk{text-align:center;font:900 38px "Segoe UI",sans-serif;color:#d0261a}
/* balonlar */
.balonlar{left:0;top:0;width:1920px;height:700px}
.bln{position:absolute;padding:20px 36px 24px;font:800 44px "Segoe UI",sans-serif;color:var(--ink);background:#fff;border:6px solid var(--ink);border-radius:40px;white-space:nowrap;animation:bubIn .45s cubic-bezier(.3,1.4,.5,1) both;box-shadow:0 10px 0 rgba(29,42,74,.18)}
.bln:after{content:"";position:absolute;left:30%;bottom:-36px;border:18px solid transparent;border-top:22px solid var(--ink)}
/* dürüm */
.durum{width:1000px;display:flex;gap:34px;align-items:center;background:#fff;border:5px solid #c7d1db;border-radius:24px;padding:30px 36px;box-shadow:0 14px 0 rgba(10,102,194,.18)}
.durum .pf{width:360px;height:360px;border-radius:50%;overflow:hidden;border:8px solid #fff;box-shadow:0 0 0 5px #c7d1db;flex:none}
.durum .pf svg{width:100%;height:100%}
.durum h3{font:900 52px "Segoe UI",sans-serif}
.durum .gv{margin-top:16px;display:inline-flex;align-items:center;gap:14px;background:#eef5fc;border-radius:14px;padding:10px 20px}
.durum .gv b{font:900 56px var(--mono);color:var(--li)}
.durum .gv small{font:700 26px "Segoe UI",sans-serif;color:#56607a}
.durum .nt{font:800 34px var(--hand);color:#c0392b;margin-top:16px}
/* terminal */
.kod{width:1000px;background:#0d1117;border:5px solid #30363d;border-radius:20px;overflow:hidden;box-shadow:0 14px 0 rgba(0,0,0,.3)}
.kod .wbar{background:#161b22;height:54px}
.kod .wbar i{width:20px;height:20px;border-radius:50%;background:#ff5f56;display:inline-block}.kod .wbar i+i{background:#ffbd2e}.kod .wbar i+i+i{background:#27c93f}
.kod .kl{font:700 50px/1.45 var(--mono);color:#c9d1d9;padding:0 34px;opacity:0;animation:lineIn .25s both}
.kod .kl:first-child{padding-top:24px}.kod .kl:last-child{padding-bottom:30px}
.kod.ok .kl:last-child{color:#7df9c4;font-size:64px}
.kod.hata .kl:last-child{color:#ff6b6b;font-size:50px}
.kod.hata{border-color:#d0261a;animation:pnIn .45s cubic-bezier(.3,1.3,.5,1) both,jolt .4s .9s}
/* mülakat */
.mul{left:300px;top:130px;width:1320px;height:640px;background:#2c3655;border-radius:24px;overflow:hidden;border:5px solid #3a4466}
.mul .vid{position:absolute;inset:0}
.mul .vid svg{width:100%;height:100%}
.mul .nm2{position:absolute;left:24px;bottom:120px;font:800 28px "Segoe UI",sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:6px 16px;border-radius:10px}
.mul .sq{position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,20,.82);color:#fff;font:800 50px/1.2 "Segoe UI",sans-serif;text-align:center;padding:22px 40px;animation:lineIn .3s .15s both}
.mul .kp{position:absolute;inset:0;background:rgba(10,12,20,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:900 70px "Segoe UI",sans-serif;animation:fadeIn .1s 1.1s both}
.mul .kp small{font:700 36px "Segoe UI",sans-serif;color:#aab3cc;margin-top:10px}
.mul .kp i{width:100px;height:100px;border:12px solid #3a4466;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px}
.mul .clk{position:absolute;right:30px;top:24px;font:900 44px var(--mono);color:#ffc93c;background:rgba(0,0,0,.5);padding:6px 20px;border-radius:12px}
/* kolay başvuru */
.kolay{left:420px;top:110px;width:1100px;height:740px}
.kolay .cn{position:absolute;right:0;top:0;width:430px;background:#fff;border:5px solid var(--ink);border-radius:22px;text-align:center;padding:18px;box-shadow:0 10px 0 rgba(29,42,74,.2)}
.kolay .cn small{display:block;font:800 26px "Segoe UI",sans-serif;color:#56607a}
.kolay .cn b{display:block;font:900 130px/1.05 var(--mono);color:var(--li)}
.kolay .btn{position:absolute;left:30px;top:40px;width:560px;height:150px;border-radius:80px;background:var(--li);color:#fff;font:900 60px/150px "Segoe UI",sans-serif;text-align:center;box-shadow:0 10px 0 #06417c;animation:kbtn .26s ease-in-out infinite}
@keyframes kbtn{0%,100%{transform:none;box-shadow:0 10px 0 #06417c}50%{transform:translateY(8px);box-shadow:0 2px 0 #06417c}}
.kolay .fg{position:absolute;left:470px;top:110px;width:120px;height:140px;animation:kfin .26s ease-in-out infinite}
@keyframes kfin{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,22px)}}
.kolay .rain{position:absolute;left:0;right:0;top:260px;bottom:0;overflow:hidden}

const CONFC=['#ff6f61','#ffc93c','#1fb5a8','#7df9c4','#ff9e8f','#fff'];

 for(let i=0;i<46;i++) h+=`<i class="conf" style="left:${Math.random()*1920}px;background:${CONFC[i%6]};${confShape(i)};animation-duration:${(1.9+Math.random()*2).toFixed(2)}s,${(.25+Math.random()*.3).toFixed(2)}s;animation-delay:${(Math.random()*.8).toFixed(2)}s,0s"></i>`;

function flash(){ const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go'); }
const KEP='<svg viewBox="0 0 120 80"><path d="M4 30L60 6l56 24-56 22z" fill="#1d1a24"/><path d="M30 42v20q30 14 60 0V42L60 54z" fill="#2a2638"/><path d="M110 32v26" stroke="#ffc93c" stroke-width="5"/><circle cx="110" cy="60" r="6" fill="#ffc93c"/></svg>';
function kepler(){ let h=''; for(let i=0;i<12;i++){ const x=300+Math.random()*1300, y1=-(300+Math.random()*350), lost=i<3; h+=`<div class="kep" style="left:${x.toFixed(0)}px;top:620px;--x1:${(Math.random()*200-100).toFixed(0)}px;--y1:${y1.toFixed(0)}px;--r1:${(Math.random()*600-300).toFixed(0)}deg;--x2:${lost?(Math.random()<.5?-1:1)*1400:(Math.random()*240-120).toFixed(0)}px;--y2:${lost?-700:40}px;--r2:${(Math.random()*900-450).toFixed(0)}deg;--o:${lost?1:0};--d:${(2.4+Math.random()).toFixed(2)}s;animation-delay:${(Math.random()*.4).toFixed(2)}s">${KEP}</div>`; } $('fx').insertAdjacentHTML('beforeend',h); SFX.whoosh(); later(SFX.conf,300); }
// anlık modda (geri gitme) geçici efektler atlanır; kalıcı durum değişiklikleri uygulanır

 else if(k==='big'){ L.insertAdjacentHTML('beforeend',`<div class="bigT">${esc(a.slice(1).join(':'))}</div>`); SFX.whoosh(); }

const TM=new Set();
function _arm(o){ if(o.iv) o.id=setInterval(o.f,o.ms); else o.id=setTimeout(()=>{ TM.delete(o); o.f(); },o.rem); o.due=performance.now()+(o.iv?0:o.rem); }
const later=(f,ms)=>{ const o={f,ms:ms||0,rem:ms||0,iv:false,id:null}; TM.add(o); if(!paused) _arm(o); return o; };
const every=(f,ms)=>{ const o={f,ms,iv:true,id:null}; TM.add(o); if(!paused) _arm(o); return o; };
function stopT(o){ if(!o)return; if(typeof o==='number'){ clearTimeout(o); clearInterval(o); return; } if(o.id!=null){ o.iv?clearInterval(o.id):clearTimeout(o.id); } o.id=null; TM.delete(o); }

//  'live' : gerçek oylar (window.VOTE = Firebase VoteSource; alt kısımdaki modül bağlar)
//  'sim'  : eski rastgele oy akışı — yalnızca ?sahte=1, ?test=1 ve video kaydında
//  'off'  : bağlantı yok — oy gösterilmez, süre dolunca kura (sunucu 1-4 ile seçebilir)
const OYQ=new URLSearchParams(location.search);
const OY_SIM=()=>OYQ.has('sahte')||OYQ.has('test');
const OY_LIVE=()=>!OY_SIM()&&!!window.VOTE&&!!window.VOTE_OK;
// ?demo=1 : herkese açık tek kişilik demo — Firebase yok, seçenekler tıklanır, hafif sanal salon oyu (bkz. DEMO bölümü)
const DEMO=OYQ.has('demo')&&!OY_SIM();
function qrSvg(){
 let seed=7,h='';const N=25,r=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const fin=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let on;
  if(fin(x,y)){const lx=x<7?x:x-(N-7),ly=y<7?y:y-(N-7);on=lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4);}
  else if((x===7&&y<8)||(y===7&&x<8)||(x===N-8&&y<8)||(y===7&&x>=N-8)||(x===7&&y>=N-8)||(y===N-8&&x<8)) on=false;
  else on=r()<.48;
  if(on)h+=`<rect x="${x}" y="${y}" width="1.03" height="1.03"/>`;
 }
 return `<svg viewBox="0 0 ${N} ${N}" fill="#0a0e1a" shape-rendering="crispEdges">${h}</svg>`;
}
$('qr').innerHTML=qrSvg();
window.qrHazir=(svg,url)=>{ $('qr').innerHTML=svg; $('qrLbl').innerHTML='Telefonunla okut, oyunu ver<br><small>'+esc(url.replace(/^https?:\/\//,''))+'</small>'; };
const DUR=DEMO?45:30; let decSeq=0;   // demo: tek kişi okuyup seçsin diye 45 sn
function showTime(left){
 left=Math.max(0,left);
 if(Math.ceil(left)<V.sec){ V.sec=Math.ceil(left); if(V.sec<=10&&V.sec>0) SFX.tick(V.sec<=5); }
 $('cnt').textContent=Math.ceil(left); $('cnt').classList.toggle('hot',left<=5); $('ring').style.strokeDashoffset=276.5*Math.min(1,(DUR-left)/DUR);
}
function startDecision(st){
 const d=st.d;
 if(!OY_SIM()&&window.VOTE_PENDING&&(st._bekle=(st._bekle||0)+1)<=20){ phase='freeze'; clearAll(); later(()=>{ if(script[pos]===st) startDecision(st); },400); return; }
 phase='freeze'; clearAll(); cues=[]; mouthOff(); wipeReset(); if(fullText) txt.textContent=fullText; stopVoice();
 stage.classList.remove('shake','mont'); stage.classList.add('frozen');
 setMusic('none'); SFX.boom();
 flash();
 dec.className=''; $('verdict').classList.remove('on');
 later(()=>{
  const n=d.o.length,poll=!!st.poll,nab=!!st.nabiz;
  $('decNo').textContent=poll?'SONUCU DEĞİŞTİRMEZ · TARTIŞMA İÇİN':nab?'SONUCU DEĞİŞTİRMEZ · SALONUN NABZI':`KARAR ${st.no||st.id+1} / ${NDEC}`;
  $('stamp').textContent=poll?'💬 SON SORU':nab?'💬 NABIZ':'⏸ KARAR ANI';
  $('verdict').innerHTML=poll||nab?'<span>SALON BÖYLE DÜŞÜNÜYOR</span><small>BOŞLUK: devam</small>':'<span>SALON KARAR VERDİ!</span><small>BOŞLUK: hikâyeye devam</small>';
  $('q').textContent=d.q;
  $('opts').innerHTML=d.o.map((o,i)=>`<div class="opt ${'abcd'[i]}" id="opt${i}"><div class="key">${i+1}</div><h4>${esc(o[0])}</h4><p>${esc(o[1])}</p><div class="track"><div class="fill" id="fill${i}"></div></div><div class="pct" id="pct${i}">%0</div></div>`).join('');
  if(DEMO) demoKarar();
  $('cnt').textContent=DUR; $('cnt').classList.remove('hot'); $('ring').style.strokeDashoffset=0; $('total').textContent='0 oy';
  dec.className='on'+(n>3?' n4':n>2?' n3':'')+(poll?' poll':'')+(nab?' nabiz':'');
  let w=d.o.map(()=>poll||nab?1+Math.random()*.3:.55+Math.random()); const ws=w.reduce((a,b)=>a+b,0); w=w.map(x=>x/ws);
  const mode=OY_LIVE()?'live':OY_SIM()||DEMO?'sim':'off';
  V={id:st.id,n,poll,c:d.o.map(()=>0),w,el:0,end:DUR,forced:null,sec:DUR,mode,note:'',demo:DEMO};
  phase='vote'; setMusic('vote'); playVoice(decVid(d),null,500);
  if(mode==='live'){
   const myV=V;
   try{
    const r=window.VOTE.open({decKey:st.id+'_'+(++decSeq).toString(36)+Date.now().toString(36).slice(-5),q:d.q,options:d.o.map(o=>o[0]),poll:poll||nab,durMs:DUR*1000});
    if(r&&r.then) r.then(x=>{ if(x&&!x.ok) myV.note='Bağlantı sorunu'; });
    window.VOTE.onUpdate(u=>{ if(V!==myV||phase!=='vote')return; if(u.counts&&u.counts.length===V.n) V.c=u.counts.slice(); paintVotes(); const left=u.remainingMs/1000; V.el=DUR-left; showTime(left); if(left<=0) finalize(); });
   }catch(e){ console.warn('[oylama] açılamadı',e); V.mode='off'; later(()=>{ every(tick,100); },900); }
  }else later(()=>{ every(tick,100); },900);
 },1100);
}
function tick(){
 if(phase!=='vote'||V.mode==='live')return;
 V.el+=.1;
 if(V.mode==='sim'){
  const burst=V.forced!==null?(V.demo?2:4):(Math.random()<(V.demo?.12:.45)?Math.floor(Math.random()*2):0);   // demo: daha seyrek sanal salon
  for(let i=0;i<burst;i++){ let r=Math.random(),k=0; while(k<V.n-1&&r>=V.w[k]){ r-=V.w[k]; k++; } V.c[k]++; }
  paintVotes();
 }
 const left=Math.max(0,V.end-V.el);
 if(V.forced===null) showTime(left);
 if(left<=0) finalize();
}
function paintVotes(){
 const t=V.c.reduce((a,b)=>a+b,0), p=V.c.map(x=>t?Math.round(x/t*100):0);
 if(t){ const mx=V.c.indexOf(Math.max(...V.c)); p[mx]+=100-p.reduce((a,b)=>a+b,0); }
 for(let i=0;i<V.n;i++){ $('fill'+i).style.width=p[i]+'%'; $('pct'+i).textContent='%'+p[i]; }
 $('total').textContent=t+' oy';
}
function forceWin(w){
 if(phase!=='vote'||V.forced!==null||!(w>=0&&w<V.n))return;
 V.forced=w;
 if(DEMO) demoSecildi(w);
 if(V.mode==='live'){ try{ window.VOTE.forceWin(w); }catch(e){ finalize(); } return; }
 V.w=V.c.map((_,i)=>i===w?1-.06*(V.n-1):.06); V.end=V.el+1.5;
}
function finalize(){
 if(phase!=='vote')return;
 if(V.mode==='live'){
  const myV=V; phase='closing'; clearAll(); $('cnt').textContent='…';
  const bitir=r=>{
   if(V!==myV||phase!=='closing')return;
   if(r&&Array.isArray(r.counts)&&r.counts.length===V.n) V.c=r.counts.slice();
   const t=V.c.reduce((a,b)=>a+b,0), mx=Math.max(...V.c), top=V.c.filter(x=>x===mx).length;
   let w=r&&Number.isInteger(r.winner)&&r.winner>=0&&r.winner<V.n?r.winner:(V.forced!==null?V.forced:Math.floor(Math.random()*V.n));
   if(V.forced!==null) V.note=''; else if(t===0) V.note=(r&&r.error?'Bağlantı sorunu':'Oy gelmedi')+' · kura çekildi'; else if(top>1) V.note='Eşitlik · kura çekildi';
   phase='vote'; sonuc(w);
  };
  let bitti=false; const tamam=r=>{ if(bitti)return; bitti=true; bitir(r); };
  setTimeout(()=>tamam(null),9000);   // ağ ne yaparsa yapsın oyun takılmaz
  window.VOTE.close().then(tamam,e=>tamam({error:String(e)}));
  return;
 }
 clearAll();
 let w;
 if(V.mode==='off'){ w=V.forced!==null?V.forced:Math.floor(Math.random()*V.n); if(V.forced===null) V.note='Çevrimdışı · kura çekildi'; }
 else{
  w=V.forced!==null?V.forced:V.c.indexOf(Math.max(...V.c));
  if(V.demo&&V.forced===null) V.note='Süre doldu · sanal salon seçti';
  let o=-1; V.c.forEach((x,i)=>{ if(i!==w&&(o<0||x>V.c[o])) o=i; });
  if(V.c[w]<=V.c[o]){ const x=V.c[w]; V.c[w]=V.c[o]+1; V.c[o]=x; }
 }
 sonuc(w);
}
function sonuc(w){
 if(phase!=='vote')return;
 paintVotes();
 stopVoice(); setMusic('none'); SFX.fanfare();
 phase='result';
 if(!V.poll){ choices.length=V.id; choices[V.id]=w; script=yap(choices); }
 for(let i=0;i<V.n;i++) $('opt'+i).classList.add(i===w?'win':V.poll?'tie':'lose');
 dec.classList.add('done');
 flash();
 if(V.note) $('verdict').insertAdjacentHTML('beforeend','<em class="oyNot">'+esc(V.note)+'</em>');
 $('verdict').classList.add('on');
}

/* ---------- GEZİNME ---------- */
function show(instant){
 clearAll(); phase=''; stopVoice(); cues=[];
 const st=script[pos];
 dec.className=''; stage.classList.remove('frozen');
 if(st.k!=='beat') wipeReset();
 if(st.k==='card'){ card.className=''; showCard(st,instant); return; }
 card.className='';
 if(st.k==='beat') showBeat(st,instant);
 else if(st.k==='montage') runMontage(st,instant);
 else startDecision(st);
}
function next(fromTitle){
 const st=script[pos];
 if(st.k==='dec'){
  if(phase==='vote'){ if(V.mode==='live') finalize(); else V.end=V.el; return; }
  if(phase!=='result') return;
 }else if(st.k==='beat'&&wipeIn) return;
 else if(st.k==='beat'&&typing){ endType(); return; }
 else if(st.k==='card'&&st.type==='title'&&!fromTitle&&!titleGo&&auto){ titleRun(); return; }
 if(pos<script.length-1){ pos++; show(); }
}
function back(){
 if(pos===0)return;
 const st=script[pos];
 if(st.k==='dec'&&!st.poll){ choices.length=st.id; script=yap(choices); }
 pos--;
 const p=script[pos];
 if(p.k==='dec'&&!p.poll){ choices.length=p.id; script=yap(choices); }
 panelKey='~'; show(true);
}
function restart(){
 choices=[]; script=yap(choices); pos=0; panelKey='~'; panelSpec=null; panel.innerHTML='';
 last={bg:''}; hudVal={g:0,c:0,y:0}; hudProf=''; perdeAd=''; $('exeP').textContent='';
 stage.classList.remove('shake','inst','mont'); $('cam').className=''; $('fx').innerHTML='';
 setCast([],true); hudBars(hudVal,false);
 show();
}

/* ---------- OTOMATİK OYNATMA + VİDEO KAYDI ---------- */
// Varsayılan: film gibi kendi akar. Oylamalar süresince bekler (orkestratör gerçek oyları bağlar). AUTO_PATH yalnızca kayıt/deneme içindir.
let AUTO_PATH=null;
let auto=true,aKey='',aT0=0,aIdle=0,rec=null,recStream=null,recArmed=false,autoOnTouch=false;
function touchAuto(){ if(autoOnTouch){ autoOnTouch=false; setAuto(true); } }
function setAuto(on){ auto=on; aKey=''; stage.style.cursor=on?'none':''; }
// emniyet ağı: bir adım beklenen süresinin çok üstünde takılırsa otomatik akışta zorla ilerlenir (oylama, başlık ve duraklatma hariç)
const montMs=st=>(st.frames||[]).reduce((a,f)=>a+(f.ms||2500),0);
function stepCap(st){
 if(st.k==='montage') return montMs(st)+2000;
 if(st.k==='beat'){ const okuma=voDur?voDur*1000+450:Math.max(3500,fullText.length*72); return Math.max(15000,okuma*2+6000); }
 if(st.k==='card') return st.type==='act'?12000:st.type==='end'?35000:0;
 return 0;
}
function forceStep(st,why){
 console.warn('[akış] takılma: '+why+' · adım '+pos+' ('+(st.id||st.k)+'), zorla ilerleniyor');
 if(typing) endType(); stopVoice(); wipeIn=false; aKey='';
 if(pos<script.length-1){ pos++; show(); }
}
setInterval(()=>{
 if(!auto||paused)return;
 const st=script[pos],key=pos+'|'+phase,now=performance.now();
 if(key!==aKey){aKey=key;aT0=now;aIdle=0;}
 const el=now-aT0, go=()=>{aKey='';next();};
 const cap=st.k==='dec'?0:stepCap(st);
 if(cap&&el>=cap){ forceStep(st,Math.round(el)+' ms > '+cap+' ms'); return; }
 if(st.k==='beat'){
  if(VO||typing||wipeIn){aIdle=0;return;}
  aIdle+=250;
  const need=voHad?0:Math.max(3500,fullText.length*72);
  if(aIdle>=800&&el>=need) go();
 }else if(st.k==='montage'){ if(montDone&&el>=600) go(); }
 else if(st.k==='dec'){
  if(phase==='vote'&&AUTO_PATH&&V.forced===null&&V.el>=8) forceWin(AUTO_PATH[st.id]||0);
  else if(phase==='result'&&el>=5000) go();
 }else if(st.type==='title'){ /* imleç animasyonu kendisi geçer */ }
 else if(st.type==='act'){ if(el>=5200) go(); }
 else if(st.type==='end'){ if(VO){aIdle=0;return;} aIdle+=250; if(aIdle>=2500&&el>=(voHad?6000:12000)) go(); }
},250);
// K: o anki ekranın kaydını başlatır (bu sekme, sesli); tekrar K: durdurur ve dosyayı indirir. Oyunun akışına dokunmaz.
async function startRec(){
 if(rec||recArmed)return; recArmed=true;
 try{ recStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true,preferCurrentTab:true,selfBrowserSurface:'include',systemAudio:'include'}); }
 catch(e){ recArmed=false; console.warn('[kayıt] başlatılamadı:',e&&e.name,e&&e.message); return; }
 recArmed=false;
 const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 const parts=[],t0=new Date(); rec=new MediaRecorder(recStream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
 rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };
 rec.onstop=()=>{
  const ty=rec&&rec.mimeType||mime||'video/webm', a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(parts,{type:ty}));
  a.download='mezuniyet-kesit-'+pad(t0.getHours())+pad(t0.getMinutes())+pad(t0.getSeconds())+'.'+(ty.indexOf('mp4')>=0?'mp4':'webm'); document.body.appendChild(a); a.click(); a.remove();
  if(recStream) recStream.getTracks().forEach(t=>t.stop()); rec=null; recStream=null; $('recOn').classList.remove('on');
 };
 recStream.getVideoTracks()[0].onended=stopRec;
 rec.start(1000); $('recOn').classList.add('on');
}
function stopRec(){ recArmed=false; if(rec&&rec.state!=='inactive') rec.stop(); else{ if(recStream) recStream.getTracks().forEach(t=>t.stop()); recStream=null; rec=null; $('recOn').classList.remove('on'); } }
// P: duraklat / sürdür. Canlı oylama bağlıysa oturum da duraklatılır (açık kararın kalan süresi korunur, telefonlar durur).
const voteLiveCtl=()=>!!(window.VOTE&&typeof window.VOTE.pause==='function'&&(V&&V.mode==='live'&&(phase==='vote'||phase==='closing')||OY_LIVE()));
function setPause(on){
 if(on===paused)return; paused=on; stage.classList.toggle('paused',on);
 if(on){ pauseT0=performance.now(); timersPause(); if(VO&&!VO.paused) VO.pause(); if(AC&&AC.state==='running') AC.suspend();
  if(voteLiveCtl()) try{ window.VOTE.pause(); }catch(_){} }
 else{ const d=performance.now()-pauseT0; aT0+=d; beatT0+=d; timersResume(); if(AC&&AC.state==='suspended') AC.resume(); if(VO&&VO.paused&&!VO.ended){ duck(true); VO.play().catch(()=>{}); }
  if(voteLiveCtl()) try{ window.VOTE.resume(); }catch(_){} }
}
function unlock(){ audio(); if(!audioOk){ audioOk=true; const st=script[pos]; if(st&&st.type==='title'){ const k=card.querySelector('.ttl b'); if(k&&k.textContent==='BOŞLUK') k.parentNode.innerHTML='<b>F</b> tam ekran <b>M</b> ses'; } } }
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 unlock();
 if(k==='m'||k==='M'){toggleMute();return;}
 if(k==='p'||k==='P'){ setPause(!paused); return; }
 if(k==='k'||k==='K'){ if(rec) stopRec(); else startRec(); return; }
 if(paused) return;
 if(k==='o'||k==='O'){ autoOnTouch=false; setAuto(!auto); return; }
 if(k===' '||k==='ArrowRight'||k==='Enter'||k==='PageDown'){e.preventDefault();touchAuto();next();}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();back();}
 else if(k>='1'&&k<='4') forceWin(+k-1);
 else if(k==='f'||k==='F'){ if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{}); }
 else if(k==='r'||k==='R')restart();
});
stage.addEventListener('click',()=>{unlock(); if(paused) return; touchAuto(); next();});

/* ---------- ÖZ SINAMA: index.html?test=1 ----------

const TKEY=(k,v)=>k==='sayac'||k==='d0'||k==='hud'?undefined:v;
async function selfTest(){
 const errs=[],ids=new Map(),wait=ms=>new Promise(r=>setTimeout(r,ms));

 muted=true; setAuto(false); audioOk=true;
 const combos=[]; (function rec(c){ const d=build(c).find(x=>x.k==='dec'&&!x.poll&&c[x.id]===undefined); if(!d){ combos.push(c); return; } for(let i=0;i<d.d.o.length;i++) rec(c.concat(i)); })([]);
 const ends={},lens=[],kid=new Map(),ks=[];
 combos.forEach(c=>{ const sc=build(c); lens.push(sc.filter(x=>x.k==='beat').length); const a=[]; sc.forEach(st=>{ const j=JSON.stringify(st,TKEY); let n=kid.get(j); if(n===undefined){ n=kid.size; kid.set(j,n); } a.push(n); if(st.k==='beat'&&st.text!=='...') ids.set(hid(st.text),st.text); if(st.k==='card'&&st.type==='end'){ ids.set(endVid(st),st.title); ends[st.title]=(ends[st.title]||0)+1; } if(st.k==='dec') ids.set(decVid(st.d),st.d.q); }); ks.push(a); });
 const cov=new Uint8Array(kid.size),pick=[]; let left=kid.size;   // açgözlü örtü
 while(left>0){ let bi=-1,bn=0; for(let i=0;i<ks.length;i++){ let n=0; const a=ks[i]; for(let j=0;j<a.length;j++) if(!cov[a[j]]){ n++; } if(n>bn){bn=n;bi=i;} } if(bi<0)break; pick.push(combos[bi]); ks[bi].forEach(x=>{ if(!cov[x]){ cov[x]=1; left--; } }); }
 const seen=new Set(); let steps=0;
 let pi=0;
 for(const c of pick){
  document.title='TEST '+(++pi)+'/'+pick.length;
  try{ restart(); }catch(e){ errs.push('restart ['+c+']: '+e.message); }
  choices=c.slice(); script=build(choices);
  for(pos=0;pos<script.length;pos++){
   const st=script[pos],key=JSON.stringify(st,TKEY); steps++;
   try{
    if(seen.has(key)) continue; seen.add(key);
    show(false);
    if(st.k==='dec'){ await wait(2100); forceWin(c[st.id]); await wait(1800); if(phase!=='result') errs.push('oylama bitmedi: '+st.d.q); choices=c.slice(); script=build(choices); }
    else if(st.k==='montage'){ await wait(Math.min(900,(st.frames||[]).reduce((a,f)=>a+(f.ms||0),0))); }
    else{ await wait(st.k==='beat'?300:150); if(st.k==='beat'){ endType(); await wait(30); } }
   }catch(e){ errs.push('ileri ['+c+'] #'+pos+': '+e.message); }
  }
  for(pos=script.length-1;pos>=0;pos--){ try{ panelKey='~'; show(true); }catch(e){ errs.push('geri ['+c+'] #'+pos+': '+e.message); } }
 }
 // gerçek zamanlı montaj sınaması: otomatik kapalıyken de montaj kendiliğinden bitmeli; duraklatma montajı dondurmalı; otomatik kipte de takılmamalı
 try{
  restart(); setAuto(false); choices=pick[0].slice(); script=build(choices);
  const ms=st=>(st.frames||[]).reduce((a,f)=>a+(f.ms||2500),0);
  let mi=-1; script.forEach((x,i)=>{ if(x.k==='montage'&&(mi<0||ms(x)<ms(script[mi]))) mi=i; });
  if(mi>=0){ const tot=ms(script[mi]);
   pos=mi; show(false); await wait(tot/2); setPause(true); await wait(tot); if(pos!==mi) errs.push('duraklatma montajı dondurmadı: '+script[mi].id);
   setPause(false); await wait(tot/2+1500); if(pos!==mi+1) errs.push('montaj kendiliğinden bitmedi (otomatik kapalı): '+script[mi].id);
   pos=mi; show(false); setAuto(true); await wait(tot+1800); if(pos<mi+1) errs.push('montaj takıldı (otomatik açık): '+script[mi].id); setAuto(false);
  } else errs.push('montaj sınaması: montaj bulunamadı');
 }catch(e){ errs.push('montaj sınaması: '+e.message); }
 const missing=[];
 if(location.protocol!=='file:') await Promise.all([...ids.keys()].map(id=>fetch('ses/'+id+'.wav',{method:'HEAD'}).then(r=>{ if(!r.ok) missing.push(id); }).catch(()=>missing.push(id))));
 try{ restart(); setAuto(false); }catch(e){ errs.push('son restart: '+e.message); }
 await wait(300);
 const rep={yol:combos.length,sinananYol:pick.length,adim:steps,tekilAdim:seen.size,replikSayisi:[Math.min(...lens),Math.max(...lens)],sonlar:ends,sesKimligi:ids.size,eksikSes:missing.length,eksikOrnek:missing.slice(0,12).map(id=>id+': '+ids.get(id).slice(0,50)),hata:errs.length,hatalar:errs.slice(0,40)};
 window.TEST=rep; document.title='TEST '+(errs.length?'HATA':'OK')+' eksikSes='+missing.length;
 const pre=document.createElement('pre'); pre.id='testout'; pre.textContent=JSON.stringify(rep,null,1);
 pre.style.cssText='position:fixed;inset:0;z-index:99;background:#000;color:#7df9c4;font:16px Consolas,monospace;padding:20px;overflow:auto;white-space:pre-wrap;user-select:text';
 document.body.appendChild(pre);
}
