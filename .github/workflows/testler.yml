name: testler
on:
  push:
  workflow_dispatch:
jobs:
  oylama:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Birim testleri
        run: npm run test:unit
      - name: Firestore kural testleri (emülatör)
        run: npm run test:rules
      - name: Entegrasyon testi (50 sanal seyirci, emülatör)
        run: npm run test:int
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Site derlemesi
        run: node site/build.mjs
      - name: Derleme testleri
        run: node --test 'site/test/*.test.mjs'
      - name: Playwright + Chromium kur
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Çevrimdışı önbellek uçtan uca testi
        run: node site/test/e2e-offline.mjs
