<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Mezuniyet.exe · kapanış kartı</title>
<!-- Tanıtım videosunun son kartı (1920×1080). tanitim/video_kaydet.js kaydeder. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1d2a4a;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 40%,#2a3b66,#1d2a4a 60%,#131c33)}
.izgara{position:fixed;inset:0;background-image:linear-gradient(rgba(125,249,230,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(125,249,230,.06) 2px,transparent 2px);background-size:64px 64px}
.kutu{position:relative;width:1180px;background:#fff;color:#1d2a4a;border-radius:14px;box-shadow:0 40px 0 rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.08);overflow:hidden;animation:gir .55s cubic-bezier(.2,1.3,.4,1) both}
.bar{display:flex;align-items:center;justify-content:space-between;padding:22px 32px;background:#f2f2f2;border-bottom:2px solid #ddd;font-weight:700;font-size:34px}
.bar b{font-weight:400;font-size:40px;color:#555}
.ic{display:flex;gap:40px;padding:48px 56px 40px;align-items:center}
.tik{flex:none;width:120px;height:120px;border-radius:50%;background:#0f8a5f;display:grid;place-items:center;font-size:76px;color:#fff;font-weight:900;animation:pop .45s .45s both}
h1{font-size:70px;line-height:1.05;color:#0f8a5f;letter-spacing:-1px}
p{font-size:34px;color:#34405e;margin-top:14px}
.alt{display:flex;justify-content:flex-end;gap:28px;padding:30px 56px 40px;background:#f6f6f6}
.btn{font-weight:800;font-size:44px;padding:20px 54px;border-radius:12px;border:4px solid #b8b8b8;background:#fff}
.btn.ana{background:#ffc93c;border-color:#1d2a4a;color:#1d2a4a;animation:nabiz 1.2s .9s infinite}
.url{position:fixed;left:0;right:0;bottom:96px;text-align:center;font:800 64px "JetBrains Mono",Consolas,monospace;color:#ffc93c;letter-spacing:1px;animation:yuk .5s .7s both}
.kim{position:fixed;left:0;right:0;bottom:46px;text-align:center;font-size:30px;color:#9fb0d6;animation:yuk .5s .9s both}
@keyframes gir{from{transform:scale(.85);opacity:0}}
@keyframes pop{from{transform:scale(0)}}
@keyframes yuk{from{transform:translateY(30px);opacity:0}}
@keyframes nabiz{50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,201,60,.35)}}
</style></head><body>
<div class="izgara"></div>
<div class="kutu" style="margin-top:-150px">
  <div class="bar"><span>Mezuniyet.exe</span><b>✕</b></div>
  <div class="ic"><div class="tik">✓</div><div><h1>Mezuniyet.exe yanıt veriyor.</h1><p>6 karar · 5 son · salonun telefonla verdiği oylarla dallanan hikâye</p></div></div>
  <div class="alt"><span class="btn">Daha sonra</span><span class="btn ana">Demoyu oyna ▶</span></div>
</div>
<div class="url">cenga-mezuniyet.pages.dev</div>
<div class="kim">CENGA sosyal etkinliği · 20 Kasım 2026</div>
</body></html>
